body { color: #36584E; background: transparent; font-family: var(--ppagent-font-body, "Microsoft YaHei"), sans-serif; }

.notes-review { position: relative; width: 1170px; height: 492px; overflow: hidden; background: transparent; }
.notes-grid { position: absolute; inset: 26px 16px; display: flex; flex-wrap: wrap; align-content: center; justify-content: center; }
.notes-review[data-item-count="4"] .notes-grid { inset: 26px 200px; gap: 20px 48px; padding: 0; }

.notes-review[data-item-count="7"] .notes-grid,

.notes-review[data-item-count="4"] .note-card { flex: 0 0 330px; }
.notes-review[data-item-count="5"] .note-card,
.notes-review[data-item-count="6"] .note-card { flex: 0 0 300px; }
.notes-review[data-item-count="7"] .note-card,
.notes-review[data-item-count="8"] .note-card { flex: 0 0 274px; }

.note-sheet { position: absolute; inset: 0; z-index: 1; width: 100%; height: 100%; overflow: visible; }
.note-sheet-shadow { fill: #477466; opacity: .30; }
.note-sheet-paper { fill: #FFFFFF; stroke: #E9EEED; stroke-width: 2; stroke-linejoin: round; }
.note-sheet-header { fill: #477466; }
.note-card:nth-child(3n+2) .note-sheet-header { fill: #477466; }
.note-card:nth-child(3n+3) .note-sheet-header { fill: #477466; }
.note-sheet-fold { fill: #E9EEED; stroke: #BFCEC9; stroke-width: 2.4; stroke-linejoin: round; }

.note-icon-area { position: absolute; z-index: 4; left: 0; top: 0; width: 44px; height: 35px; }
.note-icon-panel { position: absolute; inset: 0; background: rgba(41, 67, 59, .24); }
.note-icon-slot { position: absolute; left: 10px; top: 6px; display: grid; width: 22px; height: 22px; place-items: center; color: #FFFFFF; }
.note-icon-svg { display: block; width: 20px; height: 20px; }

.note-text-region { position: absolute; z-index: 3; left: 0; right: 12%; top: 0; bottom: 24.5%; }
.note-text-region .ppagent-text-layout { --ppagent-text-layout-gap: 0; }
.note-card[data-has-title="true"] .note-text-region .ppagent-text-layout { justify-content: flex-start; }
.note-card[data-has-title="true"] .note-text-region .ppagent-text-primitive--heading { display: flex; flex: 0 0 35px; align-items: center; min-height: 35px; margin-left: 44px; padding: 0 16px 0 10px; color: #FFFFFF; line-height: 1.1; }

.note-card[data-has-title="true"] .note-text-region .ppagent-text-primitive--list { margin: 14px 16px 0; }
.note-card[data-has-title="false"] .note-text-region { left: 16px; top: 16px; }
.note-text-region .ppagent-text-primitive--body,
.note-text-region .ppagent-text-list__item { color: #477466; line-height: 1.38; }
