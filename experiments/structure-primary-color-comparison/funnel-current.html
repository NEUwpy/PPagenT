.simple-input-core { position: relative; display: grid; place-items: center; width: var(--size); height: var(--size); margin: 0 auto; padding: 10px; border: 3px solid #fff; border-radius: 50%; color: #fff; background: #A35D4F; box-shadow: 0 5px 14px rgba(163, 93, 79,.2); }

.simple-icon-svg { width: 100%; height: 100%; color: currentColor; stroke: currentColor; }
.simple-icon-fallback { display: block; width: 10px; height: 10px; border: 2px solid currentColor; border-radius: 50%; }
