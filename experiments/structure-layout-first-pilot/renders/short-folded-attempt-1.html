.note-icon-area { position: absolute; z-index: 4; left: 0; top: 0; width: 44px; height: 35px; }

.note-card[data-has-title="true"] .note-text-region .ppagent-text-primitive--list { margin: 14px 16px 0; }
.note-card[data-has-title="false"] .note-text-region { left: 16px; top: 16px; }
.note-text-region .ppagent-text-primitive--body,
.note-text-region .ppagent-text-list__item { color: #A35D4F; line-height: 1.38; }
