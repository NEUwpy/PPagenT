html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
body { background: transparent; font-family: var(--ppagent-font-body, "Microsoft YaHei"), sans-serif; }

.merge { position: relative; width: 1170px; height: 492px; overflow: hidden; color: #3D3D3D; }
.merge > svg { position: absolute; inset: 0; z-index: 0; width: 1170px; height: 492px; overflow: visible; }

.input { position: absolute; left: 8px; top: var(--top); z-index: 2; width: 310px; height: 78px; padding: 10px 18px; overflow: hidden; border: 1px solid #EAEAEA; border-left: 8px solid var(--color); border-radius: 12px; background: #fff; box-shadow: 0 6px 14px rgba(61, 61, 61, .08); }
.input-content { width: 100%; height: 100%; --ppagent-text-layout-gap: 2px; --ppagent-heading-color: #3D3D3D; --ppagent-text-color: #505050; }

.result { position: absolute; right: 8px; top: 116px; z-index: 2; width: 300px; height: 260px; padding: 42px 36px 34px; overflow: hidden; border: 10px solid #EAEAEA; border-radius: 30px; background: #3D3D3D; color: #fff; box-shadow: 0 14px 28px rgba(61, 61, 61, .16); }
.result-content { width: 100%; height: 100%; --ppagent-text-layout-gap: 11px; --ppagent-label-color: #C2C2C2; --ppagent-heading-color: #fff; --ppagent-text-color: #EAEAEA; }
.result-content .ppagent-text-layout { justify-content: center; }
.result-content .ppagent-text-primitive--label { font-size: 12pt; line-height: 1.15; letter-spacing: 2px; }

.merge[data-input-count="6"] .input { height: 66px; padding-top: 7px; padding-bottom: 7px; }

html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
body { color: #404040; background: transparent; font-family: var(--ppagent-font-body, "Microsoft YaHei"), sans-serif; }
.parallel-review { position: relative; width: 1170px; height: 492px; overflow: hidden; background: transparent; }
.parallel-grid { position: absolute; top: 40px; display: grid; height: 410px; }
.parallel-review[data-item-count="2"] .parallel-grid { left: 198px; width: 774px; grid-template-columns: repeat(2, 1fr); gap: 54px; }

.parallel-review[data-item-count="5"] .parallel-grid { left: 15px; width: 1140px; grid-template-columns: repeat(5, 1fr); gap: 18px; }
.parallel-card { position: relative; height: 410px; }
.parallel-card-underlay { position: absolute; left: 8px; right: 8px; top: 58px; bottom: 0; border: 1px solid #EAEAEA; border-radius: 26px; background: #EAEAEA; }

.parallel-card-accent { position: absolute; left: 50%; top: 48px; width: 82px; height: 8px; margin-left: -41px; border: 0; border-radius: 9px; background: #8C8C8C; }
.parallel-marker { position: absolute; left: 50%; top: 0; width: 96px; height: 96px; margin-left: -48px; }
.parallel-marker-halo { position: absolute; inset: 0; border: 1px solid #EAEAEA; border-radius: 50%; background: #EAEAEA; }
.parallel-marker-core { position: absolute; left: 14px; top: 14px; width: 68px; height: 68px; border: 0; border-radius: 50%; background: #505050; box-shadow: 0 8px 18px rgba(80, 80, 80, .24); }
.parallel-icon-slot { position: absolute; left: 27px; top: 27px; width: 42px; height: 42px; color: #fff; }
.parallel-icon-svg { display: block; width: 36px; height: 36px; margin: 3px; color: #fff; }
.parallel-marker-orbit { position: absolute; inset: 0; border: 2px solid rgba(255, 255, 255, .78); border-radius: 50%; background: transparent; }
.parallel-marker-dot { position: absolute; width: 8px; height: 8px; border: 0; border-radius: 50%; background: #fff; }
.parallel-marker-dot-center { left: 17px; top: 17px; }

.parallel-content-rule { position: absolute; left: 50%; top: 190px; width: 54px; height: 4px; margin-left: -27px; border: 0; border-radius: 99px; background: #8C8C8C; }

.parallel-body-region .ppagent-text-primitive--body,
.parallel-body-region .ppagent-text-list__item { color: #3D3D3D; line-height: 1.5; }

.parallel-card[data-has-support="false"] .parallel-title-region { top: 166px; height: 92px; }

html,body{margin:0;padding:0;background:white;font-family:'Microsoft YaHei',sans-serif;color:#292929}
.slide{position:relative;width:1280px;height:720px;overflow:hidden;background:#fff}
.masthead{position:absolute;left:55px;top:65px;width:1170px;padding-bottom:19px;border-bottom:2px solid #353535}
.slide-title{font-size:38px;line-height:1.22;margin:0;letter-spacing:-.02em}
[data-content-frame]{position:absolute;font-size:var(--body-px)}
.copy{font-size:var(--body-px);line-height:1.30;margin:0;overflow-wrap:anywhere}
.item-title{font-size:calc(var(--body-px) + 2px);line-height:1.25;margin:0 0 5px;font-weight:700;overflow-wrap:anywhere}
.general-body{display:grid;gap:19px}
.text-items{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:17px 26px}
.text-items article{min-width:0;padding:12px 14px 10px;border-top:2px solid #858585;background:#f6f6f6}
.text-items.options article{padding:19px 23px 21px;border-top:4px solid #555;background:#f3f3f3}
.text-items.options .item-title{font-size:26px;margin-bottom:16px}
.text-items.options .copy + .copy{padding-top:12px;margin-top:12px;border-top:1px solid #d5d5d5}
.dense .text-items article{padding:6px 7px;border-top-width:1px}
.dense .text-items{gap:10px 16px}
.dense .copy{line-height:1.23}
.shared{padding:12px 17px;border-left:4px solid #777;background:#ededed}
.shared .copy{line-height:1.30}

.hr-body{display:grid;gap:24px;align-items:start}
.hr-body.side{grid-template-columns:var(--left-w) minmax(0,1fr)}
.hr-group{min-width:0}
.group-title{font-size:23px;line-height:1.2;margin:0 0 11px;padding:0 0 8px;border-bottom:2px solid #676767}
.hr-items{display:grid;gap:10px 16px}
.hr-items article{min-width:0}
.hr-body.side .hr-items article+article{border-top:1px solid #dedede;padding-top:8px}
.hr-body.bands{gap:16px}
