/* notes */
* { box-sizing: border-box; }
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
body { color: #373737; background: transparent; font-family: var(--ppagent-font-body, "Microsoft YaHei"), sans-serif; }

.notes-review { position: relative; width: 1170px; height: 492px; overflow: hidden; background: transparent; }

.notes-review[data-item-count="4"] .notes-grid { inset: 26px 200px; gap: 20px 48px; padding: 0; }

.note-icon-area { position: absolute; z-index: 4; left: 0; top: 0; width: 44px; height: 35px; }

* { box-sizing: border-box; }
html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; }
body { background: #fff; color: #242424; font-family: 'Microsoft YaHei', sans-serif; }
.slide { position: relative; width: 1280px; height: 720px; }

/* options: equal weight above a common condition, with source text in both cards */
.page-options { --option-inset: 70px; }
.page-options .parallel-review { width: 100%; height: 370px; overflow: visible; }
.page-options .parallel-review[data-item-count="2"] .parallel-grid {
  top: 5px; left: var(--option-inset); right: var(--option-inset); width: auto; height: 348px; gap: 36px;

.condition {
  position: absolute; left: var(--option-inset); right: var(--option-inset); top: 377px; height: 82px;
  display: grid; align-items: center; padding: 0 38px;

/* services: responsive asset on the left, shared operational entry on the right */
.page-services [data-content-frame] { display: grid; grid-template-columns: minmax(0, 1fr) 258px; gap: 24px; align-items: center; }

.dense-grid { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: repeat(2, 211px); gap: 30px 34px; }
