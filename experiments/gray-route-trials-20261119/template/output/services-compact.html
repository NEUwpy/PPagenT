html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
body { color: #3E3E3E; background: transparent; font-family: var(--ppagent-font-body, "Microsoft YaHei"), sans-serif; }

.notes-review { position: relative; width: 1170px; height: 492px; overflow: hidden; background: transparent; }
.notes-grid { position: absolute; inset: 26px 16px; display: flex; flex-wrap: wrap; align-content: center; justify-content: center; }
.notes-review[data-item-count="4"] .notes-grid { inset: 26px 200px; gap: 20px 48px; padding: 0; }
.notes-review[data-item-count="5"] .notes-grid,
.notes-review[data-item-count="6"] .notes-grid { gap: 20px 32px; padding: 0; }
.notes-review[data-item-count="7"] .notes-grid,
.notes-review[data-item-count="8"] .notes-grid { gap: 18px 14px; padding: 0; }

.note-card { position: relative; height: 208px; }
.notes-review[data-item-count="4"] .note-card { flex: 0 0 330px; }
.notes-review[data-item-count="5"] .note-card,
.notes-review[data-item-count="6"] .note-card { flex: 0 0 300px; }
.notes-review[data-item-count="7"] .note-card,
.notes-review[data-item-count="8"] .note-card { flex: 0 0 274px; }

.note-sheet { position: absolute; inset: 0; z-index: 1; width: 100%; height: 100%; overflow: visible; }
.note-sheet-shadow { fill: #515151; opacity: .30; }
.note-sheet-paper { fill: #FFFFFF; stroke: #EAEAEA; stroke-width: 2; stroke-linejoin: round; }
.note-sheet-header { fill: #515151; }
.note-card:nth-child(3n+2) .note-sheet-header { fill: #515151; }
.note-card:nth-child(3n+3) .note-sheet-header { fill: #515151; }
.note-sheet-fold { fill: #EAEAEA; stroke: #C2C2C2; stroke-width: 2.4; stroke-linejoin: round; }

.note-icon-area { position: absolute; z-index: 4; left: 0; top: 0; width: 44px; height: 35px; }
.note-icon-panel { position: absolute; inset: 0; background: rgba(47, 47, 47, .24); }
.note-icon-slot { position: absolute; left: 10px; top: 6px; display: grid; width: 22px; height: 22px; place-items: center; color: #FFFFFF; }
.note-icon-svg { display: block; width: 20px; height: 20px; }

.note-text-region { position: absolute; z-index: 3; left: 0; right: 12%; top: 0; bottom: 24.5%; }
.note-text-region .ppagent-text-layout { --ppagent-text-layout-gap: 0; }
.note-card[data-has-title="true"] .note-text-region .ppagent-text-layout { justify-content: flex-start; }
.note-card[data-has-title="true"] .note-text-region .ppagent-text-primitive--heading { display: flex; flex: 0 0 35px; align-items: center; min-height: 35px; margin-left: 44px; padding: 0 16px 0 10px; color: #FFFFFF; line-height: 1.1; }
.note-card[data-has-title="true"] .note-text-region .ppagent-text-primitive--body,
.note-card[data-has-title="true"] .note-text-region .ppagent-text-primitive--list { margin: 14px 16px 0; }
.note-card[data-has-title="false"] .note-text-region { left: 16px; top: 16px; }
.note-text-region .ppagent-text-primitive--body,
.note-text-region .ppagent-text-list__item { color: #515151; line-height: 1.38; }
* { box-sizing: border-box; }
html, body { margin: 0; background: #fff; color: #25272a; font-family: "Microsoft YaHei", sans-serif; }
.slide { width: 1280px; height: 720px; position: relative; overflow: hidden; background: #fff; }
.slide > h1 { position: absolute; left: 55px; top: 62px; width: 1170px; margin: 0; font-size: 40px; line-height: 1.25; }
.slide > h1::after { content: ""; display: block; width: 72px; height: 4px; margin-top: 15px; background: #53585f; }
[data-content-frame] { position: absolute; }
.slot { position: absolute; }
.ppagent-text-primitive--body { line-height: 1.33; }
.comparison, .band, .prose-groups {
  --ppagent-heading-color: var(--ppagent-color-dark);
  --ppagent-text-color: var(--ppagent-color-body);
}

.comparison { display: grid; grid-template-columns: 132px repeat(2, minmax(0, 1fr)); grid-template-rows: auto repeat(3, 1fr); min-height: 100%; }
.criteria, .option { display: grid; grid-row: span 4; grid-template-rows: subgrid; min-width: 0; }
.criterion { align-content: center; padding: 16px; background: #f0f0f1; font-size: 18px; font-weight: 700; }
.criteria > div:first-child { background: #fff; }
.criterion + .criterion { border-top: 1px solid #d3d4d6; }
.option { border-left: 1px solid #d3d4d6; }
.option > .ppagent-text-region { display: grid; align-items: center; padding: 16px 20px; border-top: 1px solid #d3d4d6; }
.option > .ppagent-text-region:first-child { padding-block: 12px; background: #e4e5e7; border: 0; }
.option > .ppagent-text-region > .ppagent-text-layout { height: auto; }
.option .ppagent-text-primitive--heading { font-size: 25px; line-height: 1.36; }
.band { display: flex; align-items: center; gap: 20px; width: 100%; padding: 12px 18px; border-left: 4px solid #53585f; background: #ededee; }
.band .ppagent-text-region { flex: 1; min-width: 0; }
.band-label { font-size: 19px; font-weight: 700; white-space: nowrap; }

.prose-groups { display: grid; gap: 18px; align-content: start; }
.prose-group { display: grid; gap: 8px; }
.prose-group > header { padding: 5px 11px; background: #eeeef0; border-left: 4px solid #53585f; font-size: 20px; line-height: 1.2; font-weight: 700; }
.prose-columns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px; }
.prose-column { display: grid; gap: 10px; align-content: start; padding: 0 10px; }
.prose-column + .prose-column { border-left: 1px solid #d3d4d6; padding-left: 20px; }
.prose-column .ppagent-text-layout { --ppagent-text-layout-gap: 2px; }
.prose-column .ppagent-text-primitive--heading { text-wrap: wrap; line-height: 1.4; }
/* The source note sheet has its own paper, shadow, fold, header and icon paths. */
.note-text-region .ppagent-text-primitive--body { line-height: 1.38; }
.slide[data-rejected] [data-content-frame] { outline: 1px dashed #ac2c2c; }
.trial-failure { position: absolute; left: 55px; top: 131px; color: #9b2020; font-size: 18px; }
</style></head>
