<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>实验数据归档 · feedback-01</title>
  <style>
    :root{--paper:#f5f4ef;--ink:#20201d;--body:#4b4a45;--muted:#85837b;--line:#d8d5cc;--accent:#a35d4f}
    *{box-sizing:border-box} body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans SC",system-ui,sans-serif}
    header{padding:44px 5vw 26px;border-bottom:1px solid var(--line)} .eyebrow{color:var(--accent);font-weight:700}
    h1{margin:14px 0 8px;font-family:"Noto Serif SC",serif;font-size:clamp(32px,4vw,56px);line-height:1.12} p{max-width:900px;color:var(--body);line-height:1.7}
    main{padding:30px 5vw 60px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:26px} figure{margin:0}
    img{width:100%;height:auto;display:block;border:1px solid var(--line)} figcaption{padding:9px 2px;color:var(--muted);font-size:14px}
    footer{padding:22px 5vw 44px;border-top:1px solid var(--line);color:var(--muted);font-size:13px}
  </style>
</head>
<body>
  <header><div class="eyebrow">FEEDBACK-01 · 中性编辑排版 001</div><h1>实验数据归档</h1><p>面向课题组教师与研究生的方案讨论。反馈修订版保留两种推进思路的权衡、启动条件与访问边界。</p></header>
  <main><div class="grid">
    <figure><img src="rendered/slide-1.png" alt="第 1 页：封面"><figcaption>01 · 封面</figcaption></figure>
    <figure><img src="rendered/slide-2.png" alt="第 2 页：讨论框架"><figcaption>02 · 讨论框架</figcaption></figure>
    <figure><img src="rendered/slide-3.png" alt="第 3 页：问题"><figcaption>03 · 问题</figcaption></figure>
    <figure><img src="rendered/slide-4.png" alt="第 4 页：记录单元"><figcaption>04 · 记录单元</figcaption></figure>
    <figure><img src="rendered/slide-5.png" alt="第 5 页：访问边界"><figcaption>05 · 访问边界</figcaption></figure>
    <figure><img src="rendered/slide-6.png" alt="第 6 页：推进思路"><figcaption>06 · 推进思路</figcaption></figure>
    <figure><img src="rendered/slide-7.png" alt="第 7 页：复核流程"><figcaption>07 · 复核流程</figcaption></figure>
    <figure><img src="rendered/slide-8.png" alt="第 8 页：试点范围"><figcaption>08 · 试点范围</figcaption></figure>
    <figure><img src="rendered/slide-9.png" alt="第 9 页：评估与收束"><figcaption>09 · 评估与收束</figcaption></figure>
  </div></main>
  <footer>源稿：inputs/manuscript.md · 无输入图片或外部事实 · PNG 对应 deliverables/deck-feedback-01.pptx</footer>
</body></html>
