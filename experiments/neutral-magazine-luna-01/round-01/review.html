<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>实验数据归档 · round-01 review</title>
  <style>
    :root { color-scheme: light; --paper:#f5f4ef; --ink:#20201d; --body:#4b4a45; --muted:#85837b; --line:#d8d5cc; --accent:#a35d4f; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: "Noto Sans SC", system-ui, sans-serif; }
    header { padding: 48px 5vw 28px; border-bottom: 1px solid var(--line); }
    .eyebrow { color: var(--accent); font-weight: 700; letter-spacing: .04em; }
    h1 { margin: 16px 0 8px; font-family: "Noto Serif SC", serif; font-size: clamp(30px, 4vw, 56px); line-height: 1.12; }
    p { color: var(--body); max-width: 820px; line-height: 1.7; }
    main { padding: 32px 5vw 64px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap: 28px; }
    figure { margin: 0; }
    figure img { display: block; width: 100%; height: auto; border: 1px solid var(--line); background: white; }
    figcaption { padding: 10px 2px 0; color: var(--muted); font-size: 14px; }
    footer { padding: 24px 5vw 48px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; }
  </style>
</head>
<body>
  <header>
    <div class="eyebrow">ROUND-01 · 中性编辑排版 001</div>
    <h1>实验数据归档</h1>
    <p>面向课题组教师与研究生的方案讨论。先让一次结果可以被理解，再决定哪些记录值得长期保存。</p>
  </header>
  <main>
    <div class="grid">
      <figure><img src="preview/slide-1.png" alt="第 1 页：封面" /><figcaption>01 · 封面</figcaption></figure>
      <figure><img src="preview/slide-2.png" alt="第 2 页：讨论框架" /><figcaption>02 · 讨论框架</figcaption></figure>
      <figure><img src="preview/slide-3.png" alt="第 3 页：问题" /><figcaption>03 · 问题</figcaption></figure>
      <figure><img src="preview/slide-4.png" alt="第 4 页：记录单元" /><figcaption>04 · 记录单元</figcaption></figure>
      <figure><img src="preview/slide-5.png" alt="第 5 页：访问边界" /><figcaption>05 · 访问边界</figcaption></figure>
      <figure><img src="preview/slide-6.png" alt="第 6 页：复核流程" /><figcaption>06 · 复核流程</figcaption></figure>
      <figure><img src="preview/slide-7.png" alt="第 7 页：试点范围" /><figcaption>07 · 试点范围</figcaption></figure>
      <figure><img src="preview/slide-8.png" alt="第 8 页：评估与收束" /><figcaption>08 · 评估与收束</figcaption></figure>
    </div>
  </main>
  <footer>源稿：inputs/manuscript.md · 无外部图片或外部事实 · 预览对应最终 deck.pptx</footer>
</body>
</html>
