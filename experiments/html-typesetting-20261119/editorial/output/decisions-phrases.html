<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>两种上线方案</title><style>:root {
  color: #1b1b1b;
  background: #deddd9;
  --paper: #fcfcfa;
  --muted: #54544f;
  --line: #d2d2ca;
  --serif: "Noto Serif SC", "SimSun", serif;
  --sans: "Noto Sans SC", "Microsoft YaHei", sans-serif;
}
* { box-sizing: border-box }
body { margin: 0; font-family: var(--sans) }
.sheet {
  inline-size: min(100%, 1280px);
  min-block-size: min(100dvh, 720px);
  margin-inline: auto;
  padding: 42px clamp(28px, 5.625vw, 72px) 34px;
  background: var(--paper);
  container-type: inline-size;
}
h1, h2, h3, p { margin: 0; font-weight: inherit }
.serif { font-family: var(--serif) }
.kicker {
  display: block;
  color: var(--muted);
  font-size: 18px;
  line-height: 1.5;
  letter-spacing: .12em;
  font-weight: 550;
  margin-block-end: 4px;
}
h1 { font-size: clamp(38px, 5.3cqi, 62px); line-height: 1.22; font-weight: 720; letter-spacing: -.045em }
.masthead { padding-block-end: 20px; border-block-end: 2px solid #252525 }
.text { line-break: strict; text-wrap: pretty }
h1.text, h2.text, h3.text { text-wrap: balance }
.phrases { word-break: keep-all; overflow-wrap: normal }
.section-label {
  display: flex;
  align-items: center;
  gap: 16px;
  margin: 0 0 14px;
  color: var(--muted);
  font-size: 18px;
  line-height: 1.5;
  letter-spacing: .12em;
  font-weight: 650;
}
.section-label::after { content: ""; flex: 1 1 0; border-block-end: 1px solid var(--line) }

.review {
  display: grid;
  grid-template-columns: minmax(0, var(--first-share)) minmax(0, 1fr);
  gap: clamp(24px, 5cqi, 58px);
  padding-block-start: 22px;
}
.review section { min-inline-size: 0 }
.review article h3 { font-size: 22px; line-height: 1.36; font-weight: 740; margin-block-end: 4px }
.review article .text-body { font-size: 19px; line-height: 1.475; color: #292927 }
.review article + article { margin-block-start: 14px }
.review .issues article + article { margin-block-start: 25px }
.review .insights { padding-inline-start: 25px; border-inline-start: 1px solid var(--line) }
.review .articles { min-inline-size: 0 }
.review.is-spread {
  grid-template-columns: minmax(0, var(--first-share)) minmax(0, 1fr);
  gap: clamp(22px, 3.35cqi, 38px);
}
.review.is-spread .insights { padding-inline-start: clamp(18px, 2cqi, 24px) }
.review.is-spread .insights .articles {
  columns: 2;
  column-gap: clamp(23px, 2.85cqi, 34px);
  column-fill: balance;
}
.review.is-spread .insights article {
  break-inside: avoid-column;
  margin: 0 0 14px;
}
.review.is-spread article h3 { font-size: 21px; line-height: 1.37 }
.review.is-spread article .text-body { line-height: 1.4 }
.review.is-spread .issues article:first-child h3 { text-wrap: pretty }
.review.is-spread article .has-balanced-lines { text-wrap: balance }

.continuous {
  columns: 2;
  column-gap: 58px;
  column-rule: 1px solid var(--line);
  padding-block-start: 22px;
}
.continuous section { display: contents }
.continuous .articles { display: contents }
.continuous .section-label { break-after: avoid-column }
.continuous article { break-inside: avoid-column; margin-block-end: 14px }
.continuous article h3 { font-size: 22px; font-weight: 700; line-height: 1.35 }
.continuous article .text-body { font-size: 19px; line-height: 1.5 }

.decisions-document .masthead { padding-block: 11px 24px }
.conditions {
  display: grid;
  grid-template-columns: max-content minmax(0, 1fr);
  gap: 24px;
  align-items: baseline;
  border-block-end: 1px solid #aaa9a2;
  padding: 21px 0;
  margin-block-end: 31px;
}
.conditions h2 { font-size: 18px; color: var(--muted); font-weight: 650; letter-spacing: .09em }
.conditions p { max-inline-size: 36em; font-size: 22px; line-height: 1.5; font-weight: 520 }
.options {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  grid-template-rows: auto auto 1fr;
  column-gap: clamp(34px, 6cqi, 72px);
}
.options article {
  display: grid;
  grid-template-rows: subgrid;
  grid-row: span 3;
  row-gap: 16px;
  min-inline-size: 0;
}
.options article + article { padding-inline-start: 28px; border-inline-start: 1px solid var(--line) }
.options h2 { font-size: clamp(28px, 3.25cqi, 38px); font-weight: 700; line-height: 1.3 }
.options .method { font-size: 22px; line-height: 1.58; max-inline-size: 24em; text-wrap: balance }
.options .tradeoff {
  border-block-start: 1px solid var(--line);
  padding-block-start: 14px;
  font-size: 20px;
  line-height: 1.65;
  color: #353533;
}
.options .tradeoff p + p { margin-block-start: 8px }
.options strong { font-weight: 720; color: #1b1b1b }

@container (max-width: 870px) {
  .review { gap: 24px }
  .review .insights { padding-inline-start: 18px }
  .review article + article { margin-block-start: 11px }
}
@container (max-width: 620px) {
  .review, .review.is-spread, .options, .conditions { grid-template-columns: minmax(0, 1fr) }
  .review .insights, .options article + article { border-inline-start: 0; padding-inline-start: 0 }
  .options { grid-template-rows: none; row-gap: 32px }
  .options article { grid-row: auto; grid-template-rows: auto; row-gap: 13px }
  .conditions { gap: 7px }
  .continuous { columns: 1 }
  .review.is-spread .insights .articles { columns: 1 }
}
</style></head>
    <body><main class="sheet decisions-document"><header class="masthead"><h1 class="text serif phrases" data-bind="title">两种<wbr>上线<wbr>方案</h1></header>
      <section class="conditions"><h2>共同前置条件</h2><p class="text " data-bind="shared">两种方案上线前均须完成回退演练，确认责任人和数据恢复步骤。</p></section>
      <div class="options"><article><h2 class="text serif phrases" data-bind="label-0">集<wbr>中<wbr>上线<wbr>方案</h2><p class="text method" data-bind="method-0">在一个周末完成全部部门切换，培训与支持资源集中投入。</p><div class="tradeoff"><p class="text text-body" data-bind="benefit-0"><strong>优势是</strong>过渡期短。</p><p class="text text-body" data-bind="risk-0"><strong>风险是</strong>问题可能集中出现，需要提前完成全量数据核对并准备值守团队。</p></div></article><article><h2 class="text serif phrases" data-bind="label-1">分批<wbr>上线<wbr>方案</h2><p class="text method" data-bind="method-1">先选择一个部门试用，再按反馈逐批推广。</p><div class="tradeoff"><p class="text text-body" data-bind="benefit-1"><strong>优点是</strong>能及时修正规则。</p><p class="text text-body" data-bind="risk-1"><strong>代价是</strong>新旧系统并存时间较长，需要维护数据同步和跨部门办理说明。</p></div></article></div></main></body></html>
