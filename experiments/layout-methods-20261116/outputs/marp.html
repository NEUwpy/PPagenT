<div class="report-col col-0">
<h2 id="%E4%B8%A4%E7%82%B9%E4%B8%8D%E8%B6%B3">两点不足</h2>
<h3 id="01-%E5%8F%98%E9%9D%A9%E8%90%BD%E5%9C%B0%E9%98%BB%E5%8A%9B%E9%87%8D%E9%87%8D">01　变革落地阻力重重</h3>
<p>顶层设计已完成；公司内部人力资源变革氛围尚未完全形成，信息系统支撑能力仍有差距，缺乏市场化管理机制。</p>
<h3 id="02-%E5%90%88%E8%A7%84%E7%AE%A1%E7%90%86%E7%9F%AD%E6%9D%BF%E4%BA%9F%E5%BE%85%E6%8F%90%E5%8D%87">02　合规管理短板亟待提升</h3>
<p>2017年巡视整改取得一定成效，也暴露人力条线基础管理薄弱：认识待提升、作风待转变、能力待增强、协同待深化。</p>
</div>
<div class="report-col col-1">
<h2 id="%E5%9B%9B%E7%82%B9%E6%84%9F%E6%82%9F">四点感悟</h2>
<h3 id="01-%E7%BB%9F%E4%B8%80%E8%AF%AD%E8%A8%80%E4%BF%83%E8%BF%9B%E4%B8%9A%E5%8A%A1%E4%B8%8E%E4%BA%BA%E5%8A%9B%E5%8D%8F%E5%90%8C">01　统一语言，促进业务与人力协同</h3>
<p>沿BLM管理模型统一语言、目标、策略，贯通业务战略、人力战略规划与落地方案，达成“三个市场化”转型目标。</p>
<h3 id="02-%E8%A7%A3%E5%86%B3%E5%AE%9E%E9%99%85%E9%97%AE%E9%A2%98%E6%98%AF%E5%94%AF%E4%B8%80%E6%A3%80%E9%AA%8C%E6%A0%87%E5%87%86">02　解决实际问题是唯一检验标准</h3>
<p>以能否解决实际问题检验变革成效，力求落地有实效。</p>
<h3 id="03-%E9%A1%B6%E5%B1%82%E8%AE%BE%E8%AE%A1%E6%8C%81%E7%BB%AD%E8%BF%AD%E4%BB%A3">03　顶层设计持续迭代</h3>
<p>加速试点、小步快跑；对标行业优秀实践，结合落地成效持续优化体系。</p>
<h3 id="04-%E7%BB%9F%E7%AD%B9%E5%8F%98%E9%9D%A9%E5%90%88%E8%A7%84%E4%B8%8E%E4%BD%9C%E9%A3%8E">04　统筹变革、合规与作风</h3>
<p>变革是硬道理，合规是硬要求，作风是硬标准；以规范管理的效率强化转型力度，以优良的思想、工作和战斗作风加快转型。</p>
</div>
