# 待验证候选；根据v1观察修订，未通过风格验收。
风格: 麦肯锡式分析页；精确、克制，以清晰的证据组织体现专业感。
身份: 字体、颜色继承大学Skin；同类文字与数据系列保持一致。
页首: 用有依据的判断作标题，下接细分隔；图题与单位贴近图，来源和页码在页脚。
证据: 比较共用维度和尺度，阶段与交付逐项对应；多个视图各提供不同依据。
解释: 靠近对应证据，说明含义、条件或行动；已有标签和结论不另占大区重复。
构图: 先按内容确定主证据与辅助说明的关系，再选局部结构或图表；栏数和比例随内容调整。
空间: 主证据占主要面积；说明按文字自然高度排布，同组紧凑、组间留白。
文字: 标题、组题、正文、注释形成稳定层级；统一角色样式后绘制，按最终排字核验。
验收: 对照参考检查比例、密度与图文对应；数据关系、文字可读性和风格分别判断。
