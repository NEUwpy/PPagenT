目标: 将稿件制作成精确、克制的麦肯锡式分析报告。
论证: 标题给判断，主体展示依据，解释说明意义；保留事实和条件。
Skin: 大学 Skin 提供字体与主题色。
视觉: 白底、近黑标题、蓝色重点和细灰线。
页面: 1280×720，外边距约56；标题下细分隔，图题与单位贴近图，来源和页码在页脚。
文字: 标题、组题、正文、注释可从32、21、18、14设计像素起排，同角色统一。
空间: 主体空间按信息贡献分配。
构图: 主证据配解释时可从3:1宽度起排；解释补充含义，同组紧凑、组间留白，容器按文字自然高度。
焦点: 完整、清楚的证据形成视觉重心。
验收: 逐页检查准确性、可读性和实际画面。
