<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>东北大学 Skin · 三条咨询排版路线</title>
<style>*{box-sizing:border-box}body{margin:0;background:#edf0f4;color:#192d44;font:16px 'Microsoft YaHei',sans-serif}header{padding:25px 32px;background:white}h1{font-size:25px;margin:0 0 9px}p{margin:6px 0;color:#526274;line-height:1.65}nav{display:flex;gap:10px;padding:15px 32px;position:sticky;top:0;background:#edf0f4;z-index:1;flex-wrap:wrap}button,a{font:inherit}button{border:1px solid #c4cdd6;border-radius:6px;background:white;color:#254564;padding:9px 16px;cursor:pointer}button.active{background:#254564;color:white}main{padding:0 24px 30px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.card{background:white;padding:12px;border-radius:8px}h2{font-size:18px;margin:2px 0 8px}.card p{font-size:13px;min-height:44px}.card img{display:block;width:100%;cursor:zoom-in;border:1px solid #d7dce3}.links{padding-top:10px;font-size:13px}a{color:#285b8e}.single .grid{grid-template-columns:1fr;max-width:1350px;margin:auto}.single .card{display:none}.single .card.chosen{display:block}dialog{border:0;padding:10px;max-width:98vw;background:white}dialog::backdrop{background:#102135dc}dialog img{display:block;max-width:95vw;max-height:90vh}.hint{font-size:13px} @media(max-width:900px){.grid{grid-template-columns:1fr}}</style>
<header><h1>同稿件，同一大学 Skin，三条排版路线</h1><p>4 张模拟汇报正文 · Luna High 独立生成 · 点击页面查看大图</p><p class="hint">比较的是参考方法迁移后的实际产物；不是开源项目原版效果，也不是模型稳定性排名。数据均为虚构。</p></header>
<nav id="pages"></nav><main><div class="grid" id="grid"></div></main><dialog id="zoom"><img alt="放大页面"><button onclick="this.parentNode.close()">关闭</button></dialog>
<script>const routes=[['a','A · 页面拆解','SlideSpeak：主证据、相邻解释和图内标注。'],['b','B · 模式与容量','appautomaton：整页模式、文字预算与对齐网格。'],['c','C · 语义布局','consulting-deck：按分析问题选择布局与图表。']];let page=1,selected='all';function render(){document.querySelector('#pages').innerHTML=[1,2,3,4].map(p=>`<button class="${p===page?'active':''}" onclick="page=${p};render()">第 ${p} 页</button>`).join('')+'<span style="flex:1"></span>'+[['all','三组并排'],...routes.map(r=>[r[0],r[1]])].map(([r,t])=>`<button class="${selected===r?'active':''}" onclick="selected='${r}';render()">${t}</button>`).join('');document.body.classList.toggle('single',selected!=='all');document.querySelector('#grid').innerHTML=routes.map(([r,t,d])=>`<article class="card ${r===selected?'chosen':''}"><h2>${t}</h2><p>${d}</p><img src="previews/${r}-${page}.png" alt="${t}第${page}页" onclick="enlarge(this.src)"><div class="links"><a href="route-${r}/deck.pptx">下载可编辑 PPTX</a></div></article>`).join('')}function enlarge(src){document.querySelector('#zoom img').src=src;document.querySelector('#zoom').showModal()}render();</script></html>
