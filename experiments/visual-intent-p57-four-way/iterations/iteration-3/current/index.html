<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>PDCA</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:#fff;color:#666;font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}.frame{position:relative;width:1170px;height:492px;margin:auto}.zone{position:absolute;width:520px;height:206px;background:#f1f1f1;padding:18px 30px;z-index:1}.zone.left{left:0}.zone.right{right:0}.zone.top{top:0}.zone.bottom{bottom:0}.zone.left{padding-right:210px}.zone.right{padding-left:210px}.zone article{height:100%;font-size:11px;line-height:1.25}.zone b{display:inline-block;background:#4168b2;color:#fff;font-weight:500;padding:3px 6px;margin:0 3px 4px 0}.zone.right b{background:#5b91cb}.zone p{display:inline;margin-right:6px;white-space:nowrap}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}.metrics div{border-right:1px solid #d1d1d1}.metrics div:last-child{border:0}.metrics small,.metrics strong{display:block;white-space:nowrap}.metrics small{font-size:10px}.metrics strong{font-size:19px;color:#396abb;font-weight:500;margin-top:2px}.right article{text-align:right}.mask{position:absolute;z-index:2;left:365px;top:26px;width:440px;height:440px;border-radius:50%;background:#fff}.diagram{position:absolute;z-index:3;left:365px;top:26px;width:440px;height:440px;overflow:visible}.segment{stroke:#2e498d;stroke-width:1.2;stroke-linejoin:miter}.arrow{stroke:#2a447f;stroke-width:1.3;stroke-linejoin:miter}.label{text-anchor:middle;dominant-baseline:middle}.cn{fill:#ffd176;font-size:20px}.en{fill:#777;font-size:16px;letter-spacing:2px}.num{fill:#abc0e7;font-size:29px;opacity:.5}.core{fill:#fff;stroke:#d5d5d5}.coretext{text-anchor:middle;fill:#444;font-size:23px}.guide{fill:none;stroke:#edf1f7;stroke-width:2}
</style><div class="frame">
<section class="zone left top"><article><b>目标设定</b><p>明确改进目标</p><b>现状分析</b><p>收集流程数据</p><b>原因分析</b><p>识别问题根源</p><b>改进策略</b><p>制定具体措施</p><div class="metrics"><div><small>目标提升</small><strong>20%</strong></div><div><small>当前效率</small><strong>80%</strong></div></div></article></section>
<section class="zone right top"><article><b>改进实施</b><p>按计划执行</p><b>员工培训</b><p>开展新流程培训</p><b>流程测试</b><p>测试新流程</p><b>反馈收集</b><p>收集反馈</p><div class="metrics"><div><small>培训</small><strong>30人</strong></div><div><small>反馈</small><strong>15条</strong></div></div></article></section>
<section class="zone left bottom"><article><b>标准化</b><p>纳入操作流程</p><b>问题解决</b><p>形成解决方案</p><b>持续改进</b><p>制定下一阶段计划</p><b>循环迭代</b><p>进入下一轮</p><div class="metrics"><div><small>标准化</small><strong>4个</strong></div><div><small>解决问题</small><strong>2个</strong></div></div></article></section>
<section class="zone right bottom"><article><b>结果监控</b><p>监控改进效果</p><b>数据分析</b><p>对照预期目标</p><b>成效评估</b><p>对照计划差距</p><b>问题识别</b><p>识别新问题</p><div class="metrics"><div><small>实际效率</small><strong>85%</strong></div><div><small>预期效率</small><strong>82%</strong></div></div></article></section>
<div class="mask"></div><svg class="diagram" viewBox="0 0 440 440" aria-label="PDCA 四步循环"></svg></div><script>
const defaultSteps=[['计划','Plan'],['执行','Do'],['检查','Check'],['行动','Act']],svg=document.querySelector('.diagram'),NS='http://www.w3.org/2000/svg',C=220,colors=['#344e9a','#4168b2','#5b91cb','#63a1d7','#527fbd','#385fa4'];const polar=(r,a)=>{let q=a*Math.PI/180;return[C+r*Math.cos(q),C+r*Math.sin(q)]},xy=p=>p.map(v=>v.toFixed(2)).join(' ');
function render(steps=defaultSteps){svg.innerHTML='';let n=steps.length,s=360/n,inner=109,outer=183;let guide=document.createElementNS(NS,'circle');guide.setAttribute('cx',C);guide.setAttribute('cy',C);guide.setAttribute('r',146);guide.setAttribute('class','guide');svg.append(guide);
for(let i=0;i<n;i++){let a=180+i*s,b=a+s,p0=polar(outer,a),p1=polar(outer,b),q1=polar(inner,b),q0=polar(inner,a),el=document.createElementNS(NS,'path');el.setAttribute('d',`M${xy(p0)} A${outer} ${outer} 0 ${s>180?1:0} 1 ${xy(p1)} L${xy(q1)} A${inner} ${inner} 0 ${s>180?1:0} 0 ${xy(q0)} Z`);el.setAttribute('fill',colors[i%colors.length]);el.setAttribute('class','segment');svg.append(el)}
// Ring bodies are complete before the four tangent arrow overlays are painted.
for(let i=0;i<n;i++){let b=180+(i+1)*s,base=polar(146,b),rad=[Math.cos(b*Math.PI/180),Math.sin(b*Math.PI/180)],tan=[-Math.sin(b*Math.PI/180),Math.cos(b*Math.PI/180)],tip=[base[0]+tan[0]*74,base[1]+tan[1]*74],a=[base[0]+rad[0]*37,base[1]+rad[1]*37],z=[base[0]-rad[0]*37,base[1]-rad[1]*37],el=document.createElementNS(NS,'path');el.setAttribute('d',`M${xy(a)} L${xy(tip)} L${xy(z)} Z`);el.setAttribute('fill',colors[i%colors.length]);el.setAttribute('class','arrow');svg.append(el)}
for(let i=0;i<n;i++){let m=180+(i+.5)*s,rot=m+90,vals=[[String(i+1).padStart(2,'0'),polar(164,m),'num',m],[steps[i][0],polar(143,m),'cn',rot],[steps[i][1],polar(80,m),'en',rot]];for(let v of vals){let t=document.createElementNS(NS,'text');t.textContent=v[0];t.setAttribute('x',v[1][0]);t.setAttribute('y',v[1][1]);t.setAttribute('class','label '+v[2]);t.setAttribute('transform',`rotate(${v[3]} ${v[1][0]} ${v[1][1]})`);svg.append(t)}}let c=document.createElementNS(NS,'circle');c.setAttribute('cx',C);c.setAttribute('cy',C);c.setAttribute('r',70);c.setAttribute('class','core');svg.append(c);[['持续改进',210],['PDCA',244]].forEach(v=>{let t=document.createElementNS(NS,'text');t.textContent=v[0];t.setAttribute('x',C);t.setAttribute('y',v[1]);t.setAttribute('class','coretext');svg.append(t)})}render();window.render=render;
</script></html>
