<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><title>PDCA</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:#fff;font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;color:#555}.frame{position:relative;width:1170px;height:492px;margin:auto;overflow:hidden}.support{position:absolute;top:0;width:520px;height:492px;background:#f1f1f1;z-index:1;padding:32px 28px}.support.left{left:0}.support.right{right:0}.support.left{padding-right:210px}.support.right{padding-left:210px}.support-grid{height:100%;display:grid;grid-template-rows:1fr 1fr;gap:14px}.support-card{min-height:0;padding:9px 0;color:#777;font-size:12px;line-height:1.35;overflow:hidden}.support-card b{display:inline-block;background:#4168b2;color:#fff;padding:4px 7px;font-size:12px;font-weight:500;margin-bottom:8px}.support-card p{margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.metrics div{border-right:1px solid #d3d3d3}.metrics div+div{border-right:0}.metrics small,.metrics strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.metrics small{font-size:11px}.metrics strong{font-size:21px;color:#3b69bc;font-weight:500;margin-top:3px}.right .support-card{text-align:right}.right .support-card b{background:#5b91cb}.right .metrics{text-align:right}.mask{position:absolute;z-index:2;left:365px;top:26px;width:440px;height:440px;border-radius:50%;background:#fff}.diagram{position:absolute;z-index:3;left:365px;top:26px;width:440px;height:440px;overflow:visible}.ring-segment{stroke:#304a91;stroke-width:1.2;stroke-linejoin:miter}.ring-arrow{stroke:#2d477e;stroke-width:1.4;stroke-linejoin:miter}.guide{fill:none;stroke:#edf1f7;stroke-width:2}.label{text-anchor:middle;dominant-baseline:middle}.cn{fill:#ffd176;font-size:20px}.en{fill:#777;font-size:16px;letter-spacing:2px}.num{fill:#aec3ea;font-size:29px;opacity:.5}.core{fill:#fff;stroke:#d5d5d5;stroke-width:1}.axis{stroke:#d5d5d5;stroke-width:1}.core-text{text-anchor:middle;fill:#444;font-size:23px}
</style>
<div class="frame">
  <section class="support left" aria-label="计划与行动支持信息"><div class="support-grid">
    <article class="support-card"><b>目标设定</b><p>明确改进目标</p><b>现状分析</b><p>收集流程数据</p><b>原因分析</b><p>识别问题根源</p><b>改进策略</b><p>制定具体措施</p><div class="metrics"><div><small>目标提升</small><strong>20%</strong></div><div><small>当前效率</small><strong>80%</strong></div></div></article>
    <article class="support-card"><b>标准化</b><p>纳入操作流程</p><b>问题解决</b><p>形成解决方案</p><b>持续改进</b><p>制定下一阶段计划</p><b>循环迭代</b><p>进入下一轮</p><div class="metrics"><div><small>标准化</small><strong>4个</strong></div><div><small>解决问题</small><strong>2个</strong></div></div></article>
  </div></section>
  <section class="support right" aria-label="执行与检查支持信息"><div class="support-grid">
    <article class="support-card"><b>改进实施</b><p>按计划执行</p><b>员工培训</b><p>开展新流程培训</p><b>流程测试</b><p>测试新流程</p><b>反馈收集</b><p>收集反馈</p><div class="metrics"><div><small>培训</small><strong>30人</strong></div><div><small>反馈</small><strong>15条</strong></div></div></article>
    <article class="support-card"><b>结果监控</b><p>监控改进效果</p><b>数据分析</b><p>对照预期目标</p><b>成效评估</b><p>对照计划差距</p><b>问题识别</b><p>识别新问题</p><div class="metrics"><div><small>实际效率</small><strong>85%</strong></div><div><small>预期效率</small><strong>82%</strong></div></div></article>
  </div></section>
  <div class="mask" aria-hidden="true"></div><svg class="diagram" viewBox="0 0 440 440" role="img" aria-label="PDCA 四步循环"></svg>
</div>
<script>
const baseSteps=[{title:'计划',english:'Plan'},{title:'执行',english:'Do'},{title:'检查',english:'Check'},{title:'行动',english:'Act'}];
const svg=document.querySelector('.diagram'),NS='http://www.w3.org/2000/svg',C=220,colors=['#344e9a','#4168b2','#5b91cb','#63a1d7','#527fbd','#385fa4'];
function polar(r,a){const q=a*Math.PI/180;return [C+r*Math.cos(q),C+r*Math.sin(q)]}function xy(q){return q.map(v=>v.toFixed(2)).join(' ')}
function render(steps=baseSteps){svg.innerHTML='';const n=steps.length,sweep=360/n,inner=109,outer=183;const guide=document.createElementNS(NS,'circle');guide.setAttribute('cx',C);guide.setAttribute('cy',C);guide.setAttribute('r',146);guide.setAttribute('class','guide');svg.append(guide);
  const sectors=[];for(let i=0;i<n;i++){const start=180+i*sweep,end=start+sweep,mid=(start+end)/2,p0=polar(outer,start),p1=polar(outer,end),q1=polar(inner,end),q0=polar(inner,start);const d=`M${xy(p0)} A${outer} ${outer} 0 ${sweep>180?1:0} 1 ${xy(p1)} L${xy(q1)} A${inner} ${inner} 0 ${sweep>180?1:0} 0 ${xy(q0)} Z`;const el=document.createElementNS(NS,'path');el.setAttribute('d',d);el.setAttribute('fill',colors[i%colors.length]);el.setAttribute('class','ring-segment');sectors.push(el);svg.append(el)}
  // Draw all segment bodies first, then every arrow in a separate top layer.
  for(let i=0;i<n;i++){const end=180+(i+1)*sweep,center=polar(146,end),rad=[Math.cos(end*Math.PI/180),Math.sin(end*Math.PI/180)],tan=[-Math.sin(end*Math.PI/180),Math.cos(end*Math.PI/180)],tip=[center[0]+tan[0]*47,center[1]+tan[1]*47],a=[center[0]+rad[0]*60,center[1]+rad[1]*60],b=[center[0]-rad[0]*60,center[1]-rad[1]*60];const arrow=document.createElementNS(NS,'path');arrow.setAttribute('d',`M${xy(a)} L${xy(tip)} L${xy(b)} Z`);arrow.setAttribute('fill',colors[i%colors.length]);arrow.setAttribute('class','ring-arrow');svg.append(arrow)}
  for(let i=0;i<n;i++){const mid=180+(i+.5)*sweep;const np=polar(164,mid),cp=polar(143,mid),ep=polar(80,mid),rot=mid+90;[[String(i+1).padStart(2,'0'),np,'num',mid],[steps[i].title,cp,'cn',rot],[steps[i].english,ep,'en',rot]].forEach(([text,pos,cl,r])=>{const t=document.createElementNS(NS,'text');t.textContent=text;t.setAttribute('x',pos[0]);t.setAttribute('y',pos[1]);t.setAttribute('class','label '+cl);t.setAttribute('transform',`rotate(${r} ${pos[0]} ${pos[1]})`);svg.append(t)})}
  const core=document.createElementNS(NS,'circle');core.setAttribute('cx',C);core.setAttribute('cy',C);core.setAttribute('r',70);core.setAttribute('class','core');svg.append(core);[[210,'持续改进'],[244,'PDCA']].forEach(([y,text])=>{const t=document.createElementNS(NS,'text');t.setAttribute('x',C);t.setAttribute('y',y);t.setAttribute('class','core-text');t.textContent=text;svg.append(t)})}
render();window.render=render;
</script></html>
