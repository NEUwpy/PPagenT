*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;background:#fff;color:#707070}.frame{position:relative;width:1170px;height:492px;margin:auto}.zone{position:absolute;width:520px;height:196px;background:#f1f1f1;padding:15px 28px;z-index:1}.zone.left{left:0;padding-right:210px}.zone.right{right:0;padding-left:210px}.zone.top{top:0}.zone.bottom{bottom:0}.details{display:grid;gap:3px}.detail{display:grid;grid-template-columns:max-content 1fr;align-items:center;gap:7px;white-space:nowrap}.right .detail{grid-template-columns:1fr max-content}.tag{padding:3px 6px;background:#4168b2;color:#fff;font-size:11px}.right .tag{background:#5b91cb;grid-column:2}.desc{font-size:11px;overflow:visible}.right .desc{text-align:right;grid-column:1;grid-row:1}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:9px}.metrics>div{min-width:0;border-right:1px solid #d1d1d1}.metrics>div:last-child{border:0}.metrics small,.metrics strong{display:block;white-space:nowrap}.metrics small{font-size:10px}.metrics strong{font-size:20px;line-height:1.1;color:#396abb;font-weight:500;margin-top:3px}.right .metrics{text-align:right}.mask{position:absolute;z-index:2;left:345px;top:6px;width:480px;height:480px;background:#fff;border-radius:50%}.diagram{position:absolute;z-index:3;left:345px;top:6px;width:480px;height:480px;overflow:visible}.segment{stroke:none}.arrow{stroke:none}.label{text-anchor:middle;dominant-baseline:middle}.cn{fill:#ffd176;font-size:20px}.en{fill:#777;font-size:16px;letter-spacing:2px}.num{fill:#aec1e6;font-size:29px;opacity:.48}.core{fill:#fff;stroke:#d5d5d5;stroke-width:1}.coretext{text-anchor:middle;fill:#444;font-size:23px}

const defaults=[['计划','Plan'],['执行','Do'],['检查','Check'],['行动','Act']],svg=document.querySelector('.diagram'),NS='http://www.w3.org/2000/svg',C=240,cols=['#344e9a','#4168b2','#5b91cb','#63a1d7','#527fbd','#385fa4'];const P=(r,a)=>{let q=a*Math.PI/180;return[C+r*Math.cos(q),C+r*Math.sin(q)]},X=p=>p.map(v=>v.toFixed(2)).join(' ');

for(let i=0;i<n;i++){let m=180+(i+.5)*s,r=m+90,items=[[String(i+1).padStart(2,'0'),P(178,m),'num',m],[steps[i][0],P(154,m),'cn',r],[steps[i][1],P(88,m),'en',r]];for(let v of items){let t=document.createElementNS(NS,'text');t.textContent=v[0];t.setAttribute('x',v[1][0]);t.setAttribute('y',v[1][1]);t.setAttribute('class','label '+v[2]);t.setAttribute('transform',`rotate(${v[3]} ${v[1][0]} ${v[1][1]})`);svg.append(t)}}let c=document.createElementNS(NS,'circle');c.setAttribute('cx',C);c.setAttribute('cy',C);c.setAttribute('r',76);c.setAttribute('class','core');svg.append(c);[['持续改进',229],['PDCA',264]].forEach(v=>{let t=document.createElementNS(NS,'text');t.textContent=v[0];t.setAttribute('x',C);t.setAttribute('y',v[1]);t.setAttribute('class','coretext');svg.append(t)})}render();window.render=render;
