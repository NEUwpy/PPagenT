<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>PDCA</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:#fff;font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;color:#707070}.frame{position:relative;width:1170px;height:492px;margin:auto}.support-layer{position:absolute;inset:0;z-index:1}.group{position:absolute;width:520px;height:220px;background:#f1f1f1;padding:16px 28px;display:grid;gap:8px}.group.left{left:0;padding-right:205px}.group.right{right:0;padding-left:205px}.group.top{top:0}.group.bottom{bottom:0}.group-card{min-height:0}.rows{display:grid;gap:3px}.row{display:grid;grid-template-columns:max-content 1fr;gap:6px;align-items:center;white-space:nowrap}.right .row{grid-template-columns:1fr max-content}.tag{background:#4168b2;color:#fff;padding:3px 6px;font-size:11px}.right .tag{background:#5b91cb;grid-column:2}.desc{font-size:11px}.right .desc{text-align:right;grid-column:1;grid-row:1}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:9px}.metrics div{border-right:1px solid #d2d2d2}.metrics div:last-child{border:0}.metrics small,.metrics strong{display:block;white-space:nowrap}.metrics small{font-size:10px}.metrics strong{font-size:20px;color:#396abb;font-weight:500}.right .metrics{text-align:right}.mask{position:absolute;z-index:2;left:345px;top:6px;width:480px;height:480px;border-radius:50%;background:#fff}.art{position:absolute;z-index:3;left:345px;top:6px;width:480px;height:480px;overflow:visible}.breath{fill:none;stroke:#fff;stroke-width:24}.band,.arrow{stroke:none}.txt{text-anchor:middle;dominant-baseline:middle}.stage{fill:#ffd176;font-size:20px}.aux{fill:#777;font-size:16px;letter-spacing:2px}.num{fill:#aec1e6;font-size:29px;opacity:.48}.core{fill:#fff;stroke:#d5d5d5}.coretxt{text-anchor:middle;fill:#444;font-size:23px}</style><main class="frame"><div class="support-layer"></div><div class="mask" aria-hidden="true"></div><svg class="art" viewBox=" const data={canvas:{width:1170,height:492},centerLabel:['PDCA','循环'],items:[{key:'plan',title:'计划',en:'Plan',details:[['目标设定','明确改进目标，如提高生产效率'],['现状分析','收集并分析当前流程数据'],['原因分析','识别问题根源，如设备老化'],['改进策略','制定具体的改进措施']],metrics:[['目标生产效率提升','20%'],['当前生产效率','80%']]},{key:'do',title:'执行',en:'Do',details:[['改进实施','按照计划执行改进措施'],['员工培训','对员工进行新流程培训'],['流程测试','在控制环境中测试新流程'],['反馈收集','收集员工和客户的反馈']],metrics:[['培训员工人数','30人'],['收集的反馈数量','15条']]},{key:'check',title:'检查',en:'Check',details:[['结果监控','监控改进措施的效果'],['数据分析','分析改进后的数据与预期目标'],['成效评估','评估实际成效与计划目标的差距'],['问题识别','识别实施过程中的新问题']],metrics:[['实际生产效率','85%'],['预期效率','82%']]},{key:'act',title:'行动',en:'Act',details:[['标准化','将有效措施纳入标准操作流程'],['问题解决','针对新问题制定解决方案'],['持续改进','制定下一阶段的改进计划'],['循环迭代','准备进入下一个PDCA循环']],metrics:[['标准化流程数量','4个'],['解决的问题数量','2个']]}]},layer=document.querySelector('.support-layer'),svg=document.querySelector('.art'),NS='http://www.w3.org/2000/svg',C=240,colors=['#344e9a','#4168b2','#5b91cb','#63a1d7','#527fbd','#385fa4'],layout={outer:226,band:78,inner:148,breath:12,arrowReach:78,arrowHalf:39};const pt=(r,a)=>{let q=a*Math.PI/180;return[C+r*Math.cos(q),C+r*Math.sin(q)]},fmt=p=>p.map(v=>v.toFixed(2)).join(' '),readable=a=>{let r=a+90;return r>90&&r<270?r+180:r};

function renderPanels(items){layer.replaceChildren();let groups={};items.forEach((item,i)=>{let mid=180+(i+.5)*360/items.length,side=Math.cos(mid*Math.PI/180)<0?'left':'right',v=Math.sin(mid*Math.PI/180)<0?'top':'bottom',key=side+'-'+v;if(!groups[key]){let g=document.createElement('section');g.className=`group ${side} ${v}`;g.dataset.group=key;g.style.gridTemplateRows=`repeat(${items.filter((_,j)=>{let m=180+(j+.5)*360/items.length;return (Math.cos(m*Math.PI/180)<0?'left':'right')+'-'+(Math.sin(m*Math.PI/180)<0?'top':'bottom')===key}).length},1fr)`;groups[key]=g;layer.append(g)}groups[key].append(card(item,side))})}
function renderMain(items,center){svg.innerHTML='';let n=items.length,s=360/n,halo=document.createElementNS(NS,'circle');halo.setAttribute('cx',C);halo.setAttribute('cy',C);halo.setAttribute('r',layout.outer+layout.breath);halo.setAttribute('class','breath');svg.append(halo);for(let i=0;i<n;i++){let a=180+i*s,b=a+s,A=pt(layout.outer,a),B=pt(layout.outer,b),D=pt(layout.inner,b),E=pt(layout.inner,a),el=document.createElementNS(NS,'path');el.setAttribute('d',`M${fmt(A)} A${layout.outer} ${layout.outer} 0 ${s>180?1:0} 1 ${fmt(B)} L${fmt(D)} A${layout.inner} ${layout.inner} 0 ${s>180?1:0} 0 ${fmt(E)} Z`);el.setAttribute('fill',colors[i%colors.length]);el.className.baseVal='band';el.dataset.key=items[i].key;svg.append(el)}for(let i=0;i<n;i++){let end=180+(i+1)*s,base=pt(layout.outer-layout.band/2,end),q=end*Math.PI/180,rad=[Math.cos(q),Math.sin(q)],tan=[-Math.sin(q),Math.cos(q)],tip=[base[0]+tan[0]*layout.arrowReach,base[1]+tan[1]*layout.arrowReach],u=[base[0]+rad[0]*layout.arrowHalf,base[1]+rad[1]*layout.arrowHalf],v=[base[0]-rad[0]*layout.arrowHalf,base[1]-rad[1]*layout.arrowHalf],el=document.createElementNS(NS,'path');el.setAttribute('d',`M${fmt(u)} L${fmt(tip)} L${fmt(v)} Z`);el.setAttribute('fill',colors[i%colors.length]);el.className.baseVal='arrow';el.dataset.key=items[i].key;svg.append(el)}for(let i=0;i<n;i++){let start=180+i*s,end=start+s,mid=start+s/2,num=end-s*.18,roles=[[String(i+1).padStart(2,'0'),pt(layout.outer-layout.band*.62,num),'num',0],[items[i].title,pt(layout.outer-layout.band*.5,mid),'stage',readable(mid)],[items[i].en,pt(layout.inner*.58,mid),'aux',readable(mid)]];roles.forEach(v=>{let t=document.createElementNS(NS,'text');t.textContent=v[0];t.setAttribute('x',v[1][0]);t.setAttribute('y',v[1][1]);t.setAttribute('class','txt '+v[2]);t.setAttribute('transform',`rotate(${v[3]} ${v[1][0]} ${v[1][1]})`);t.dataset.key=items[i].key;svg.append(t)})}let core=document.createElementNS(NS,'circle');core.setAttribute('cx',C);core.setAttribute('cy',C);core.setAttribute('r',layout.band*.97);core.classList.add('core');svg.append(core);center.forEach((v,i)=>{let t=document.createElementNS(NS,'text');t.textContent=v;t.setAttribute('x',C);t.setAttribute('y',229+i*35);t.classList.add('coretxt');svg.append(t)})}
