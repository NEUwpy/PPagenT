<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>预留编排实验对照</title><style>body{margin:28px;background:#f4f5f7;color:#223044;font:16px system-ui}h1{font-size:25px}p{max-width:1100px;line-height:1.6}.pair{display:grid;grid-template-columns:1fr 1fr;gap:18px}figure{margin:0}img{width:100%;background:white}figcaption{margin:10px 0}section{margin:32px 0}a{color:#285ba4}</style><h1>固定区域后，文字怎样组织</h1><p>同一份稿件、同一个结构、相同的预留区域和字号。左侧为第一轮，右侧为第二轮修订。结构调用成功与视觉通过分别判断；最新验收结论见复核记录。</p><a href="主任务复核.md">主任务复核记录</a> · <a href="实验说明.md">实验边界</a><main id="pages"></main><script>const names=['左图右文','左文右图','上图下文'];pages.innerHTML=names.map((name,i)=>`<section><h2>${i+1} · ${name}</h2><div class="pair">${[['revision-01','第一轮：未通过视觉验收'],['revision-02','第二轮：以复核记录为准']].map(([run,label])=>`<figure><figcaption>${label}</figcaption><a href="luna/renders-${run}-validated/slide-${i+1}.png"><img src="luna/renders-${run}-validated/slide-${i+1}.png" alt="${name} ${label}"></a></figure>`).join('')}</div></section>`).join('');</script></html>
