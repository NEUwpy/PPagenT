on{border:0;border-radius:9px;background:var(--blue);color:#fff;font-weight:700;padding:10px 15px}.native-preview-actions span{color:var(--muted);font-size:11px;line-height:1.55}.native-preview-actions a{margin-left:auto;color:var(--blue);font-size:11px}
    .debug-panel{margin-top:16px}.debug-panel>summary{padding:14px 17px;cursor:pointer;font-size:13px;font-weight:700}.grid{display:grid;grid-template-columns:minmax(300px,.82fr) minmax(420px,1.18fr);gap:16px;padding:0 14px 14px}.events{max-height:520px;overflow:auto;padding:9px}.event{width:100%;border:0;background:transparent;text-align:left;padding:10px;border-radius:11px;display:grid;grid-template-columns:8px 1fr auto;gap:10px;align-items:start}.event:hover,.event.active{background:#edf3f9}.event i{width:8px;height:8px;border-radius:50%;margin-top:5px;background:#aab5c3}.event i.running,.event i.awaiting-user{background:var(--amber)}.event i.succeeded{background:var(--green)}.event i.failed,.event i.invalid-output{background:var(--red)}.event b{display:block;font-size:12px}.event small{display:block;color:var(--muted);margin-top:4px;line-height:1.45}.event time{font-size:10px;color:#9aa5b4;white-space:nowrap}.detail{min-height:380px;max-height:520px;overflow:auto;padding:16px}.detail-empty{display:grid;place-items:center;min-height:300px;color:var(--muted);font-size:13px}.detail-section{margin-bottom:16px}.detail-section h4{margin:0 0 8px;font-size:12px;color:#617086}.detail-section pre{margin:0;padding:13px;border-radius:11px;background:#101a29;color:#dce7f5;white-space:pre-wrap;word-break:break-word;font:11px/1.55 Consolas,"Microsoft YaHei",monospace;max-height:320px;overflow:auto}.detail-section .text{padding:12px;border:1px solid var(--line);border-radius:11px;background:#f8fafc;font-size:12px;line-height:1.65;white-space:pre-wrap;word-break:break-word}
    .artifacts{margin-top:16px}.artifact-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;padding:14px}.artifact{display:block;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#f8fafc;color:var(--ink);text-decoration:none}.artifact img{display:block;width:100%;aspect-ratio:16/9;object-fit:contain;background:#e9eef5}.artifact strong{display:block;padding:10px 12px;font-size:12px}.artifact.file{padding:16px}.artifact.file strong{padding:0}.error-box{padding:12px 14px;border-radius:11px;background:#fff0f1;color:#a2333d;font-size:12px;margin-bottom:15px}
    @media(max-width:1180px){.new-run{grid-template-columns:1fr auto}.checkpoint-option{grid-column:1}.pipeline{grid-template-columns:repeat(4,1fr)}.stage:after{display:none}.reader-grid,.grid{grid-template-columns:1fr}.page-form{grid-template-columns:1fr 1fr}.page-form header{grid-column:1/-1}}@media(max-width:760px){.app{display:block}.side{display:none}main{padding:18px}.new-run{grid-template-columns:1fr}.run-button{height:52px}.pipeline{grid-template-columns:repeat(2,1fr)}.page-form{grid-template-columns:1fr}}

<body>
  <div class="app">
    <aside class="side"><div class="brand"><div class="mark"></div><div><strong>PPagenT</strong><small>正式生成工作台</small></div></div><button id="new-task" class="new-task-button" type="button">＋ 新建任务</button><h3>最近运行</h3><div class="run-tools"><label class="select-all-runs"><input id="select-all-runs" type="checkbox"><span>全选当前列表</span></label><button id="delete-selected-runs" type="button" disabled>删除所选</button><button id="delete-all-runs" class="danger" type="button" disabled>清空全部可删记录</button></div><div id="run-list" class="run-list"></div></aside>
    <main>
      <header class="topbar"><div><h1>稿件怎样变成 PPT</h1><p>沿正式生成线查看每一步的输入、提示词、导演输出和确定性程序。</p></div><div id="env" class="env"></div></header>
      <section class="new-run">
        <label id="drop" class="drop"><input id="file" type="file" accept=".docx,.md,.markdown,.txt"><div class="drop-icon">＋</div><div><b id="file-name">选择或拖入稿件</b><span>DOCX、Markdown 或 TXT</span></div></label>
        <label class="checkpoint-option"><input id="manual-checkpoint" type="checkbox"><span><b>调试时暂停表单</b><span>可选查看或修改视觉模型填写的页面职责、节奏和资产方案；正式生成默认自动继续。</span></span></label>
        <button id="run" class="run-button" disabled>开始生成</button>
      </section>
      <section id="empty" class="empty">选择稿件开始运行，或从左侧打开历史运行。</section>
      <section id="workspace" class="workspace">
        <div class="summary"><div><h2 id="run-title"></h2><div id="run-meta" class="summary-meta"></div></div><div id="run-state" class="chip"></div></div>
        <div id="debug-entry" class="debug-entry"></div><div class="meter"><i id="meter"></i></div><div id="pipeline" class="pipeline"></div>
        <section class="panel stage-reader"><div class="panel-head"><h3 id="reader-title">生成步骤</h3><span id="reader-status"></span></div><div id="reader" class="stage-reader-body"><div class="reader-empty">点击上方任一步骤查看</div></div></section>
        <details class="panel debug-panel"><summary>原始运行记录与调试细节（默认收起）</summary><div class="grid"><section class="panel"><div class="panel-head"><h3 id="events-title">真实流转记录</h3><span id="event-count"></span></div><div id="events" class="events"></div></section><section class="panel"><div class="panel-head"><h3>单条原始记录</h3><span id="detail-hint">点击左侧记录查看</span></div><div id="detail" class="detail"><div class="detail-empty">尚未选择记录</div></div></section></div></details>
        <section id="artifacts-panel" class="panel artifacts" hidden><div class="panel-head"><h3>生成结果</h3><span>同一条生成线的 Renderer 产物</span></div><div id="artifacts" class="artifact-grid"></div></section>
      </section>
    </main>
  </div>
  <script>
    const stages=[
      ["manuscript-normalization","稿件进入","原文件 → 规范化 Markdown"],
      ["content-director","内容导演","整套叙事、拆页与逐页内容稿"],
      ["shell-scaffold","页面壳","封面、目录、正文与尾页"],
      ["visual-candidates","资产候选","按 Logic 找合法核心资产"],
      ["visual-director","视觉导演","选资产、排版并填写程序表单"],
      ["visual-resolution","确定性解析","校验、State、绑定与载荷"],
      ["native-preview","PPT 排版预览","直接生成暂存 PPTX、逐页渲染与质量门禁"],
      ["delivery","PPT 交付","确认后交付同一份 PPTX，不再排版"]
    ];
    const handoffs={
      "manuscript-normalization":"程序读取上传文件并统一转为 Markdown。这里不调用模型；输出全文会原样交给内容导演。",
      "content-director":"内容导演一次读取全文；每个 H1 就是一页，H2/H3 与列表形成页内内容。程序再编译 DeckPlan / PageContent。其输出不决定视觉资产，随后交给页面壳与视觉候选发现。",
      "shell-scaffold":"确定性程序补齐封面、目录、正文和尾页角色，不修改正文语义，随后为每个正文页准备视觉候选。",
      "visual-candidates":"程序依据内容导演识别的 Logic、容量和核心资产契约列出合法候选；这一步不调用模型，也不强行跨 Logic。",
      "visual-director":"视觉导演同时拿逐页内容稿与合法资产清单，填写结构、Composition、文字区域等正式表单。若本次开启人工检查，就在这里暂停修改同一份输出。",
      "visual-resolution":"程序验证视觉导演表单，确定 State、内容绑定与组件载荷。人工修改也走这一个解析器，不另建手动生成线。",
      "native-preview":"程序直接在原始 Skin 模板上排版并生成暂存 Native PPTX，再把这份 PPTX 渲染成逐页图片。这里不调用模型，也不生成整套 HTML。",
      "delivery":"确认后只把已经看过的暂存 PPTX 复制到交付目录；不再选择资产、不再排版、不再编译。"
    };
    const labels={"stage-call":"阶段调用","api-call":"模型 API","manual-checkpoint":"可选表单暂停","delivery":"交付"};
    let config=null,file=null,currentRun=null,events=[],selectedStage=null,pollTimer=null,readerToken=0,checkpointDraft=null,lastViewSignature=null,lastReaderSignature=null,lastRunListSignature=null,lastPipelineSignature=null,lastEventListSignature=null,lastArtifactSignature=null,activeRunId=null,runSummaries=[],deletableRunCount=0,previewPageIndex=0,previewRunId=null;
    const selectedRunIds=new Set();
    const traceCache=new Map();const $=id=>document.getElementById(id);const esc=value=>String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

    async function submitCheckpoint(){const button=$("continue-run"),message=$("checkpoint-message");button.disabled=true;message.textContent="正在提交给同一条确定性生成线…";try{await json(`/api/workbench/runs/${currentRun.runId}/checkpoint/visual-director`,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({output:checkpointDraft})});currentRun=await json(`/api/workbench/runs/${currentRun.runId}`);await loadEvents();render();schedule()}catch(error){message.textContent=error.message;button.disabled=false}}
    async function renderNativePreviewCheckpoint(){const state=await json(`/api/workbench/runs/${currentRun.runId}/checkpoint/native-ppt`);const slot=$("native-preview-slot");if(!slot)return;const summary=currentRun.nativePreview||{};const artifactHref=path=>`/api/workbench/runs/${currentRun.runId}/artifact?path=${encodeURIComponent(path)}`;const pageHrefs=(summary.pagePaths||[]).map(artifactHref);const montageHref=summary.montagePath?artifactHref(summary.montagePath):null;const pptxHref=summary.pptxPath?artifactHref(summary.pptxPath):null;if(previewRunId!==currentRun.runId){previewRunId=currentRun.runId;previewPageIndex=0}previewPageIndex=Math.min(Math.max(previewPageIndex,0),Math.max(pageHrefs.length-1,0));const thumbnails=pageHrefs.map((href,index)=>`<button class="native-preview-page ${index===previewPageIndex?"active":""}" type="button" data-preview-page="${index}" aria-label="查看第 ${index+1} 页"><b>${index+1}</b><img src="${href}" alt="第 ${index+1} 页缩略图" loading="lazy"></button>`).join("");const viewer=pageHrefs.length?`<div class="native-preview-viewer"><div class="native-preview-stage"><img id="native-preview-current" class="native-preview-image" src="${pageHrefs[previewPageIndex]}" alt="第 ${previewPageIndex+1} 页"></div><div class="native-preview-nav"><button id="preview-prev" type="button">← 上一页</button><strong id="preview-count">第 ${previewPageIndex+1} / ${pageHrefs.length} 页</strong><button id="preview-next" type="button">下一页 →</button><a id="preview-original" href="${pageHrefs[previewPageIndex]}" target="_blank">打开当前页原图 ↗</a></div><div class="native-preview-pages" aria-label="全部页面缩略图">${thumbnails}</div></div>`:montageHref?`<div class="native-preview-viewer"><div class="native-preview-stage"><img class="native-preview-image" src="${montageHref}" alt="整套 PPT 总览"></div><div class="native-preview-empty">当前记录只有总览图，没有逐页图片。</div></div>`:'<div class="native-preview-empty">这次运行还没有可显示的逐页预览。</div>';slot.innerHTML=`<section class="native-preview"><div class="native-preview-head"><h4>正式生成线 PPT 排版结果</h4><span>${esc(state.preview?.pageCount||summary.pageCount||pageHrefs.length)} 页 · 可直接在工作台内逐页查看</span></div>${viewer}<div class="native-preview-actions"><button id="approve-native-preview" type="button">确认并交付这份 PPT</button><span id="native-preview-message">确认后只复制这份暂存 PPTX；不会再次排版或编译。</span>${pptxHref?`<a href="${pptxHref}" target="_blank">打开暂存 PPTX ↗</a>`:""}</div></section>`;if(pageHrefs.length){const selectPage=index=>{previewPageIndex=Math.min(Math.max(index,0),pageHrefs.length-1);const current=$("native-preview-current");current.src=pageHrefs[previewPageIndex];current.alt=`第 ${previewPageIndex+1} 页`;$("preview-count").textContent=`第 ${previewPageIndex+1} / ${pageHrefs.length} 页`;$("preview-original").href=pageHrefs[previewPageIndex];$("preview-prev").disabled=previewPageIndex===0;$("preview-next").disabled=previewPageIndex===pageHrefs.length-1;document.querySelectorAll("[data-preview-page]").forEach(node=>node.classList.toggle("active",Number(node.dataset.previewPage)===previewPageIndex))};document.querySelectorAll("[data-preview-page]").forEach(node=>node.onclick=()=>selectPage(Number(node.dataset.previewPage)));$("preview-prev").onclick=()=>selectPage(previewPageIndex-1);$("preview-next").onclick=()=>selectPage(previewPageIndex+1);selectPage(previewPageIndex)}$("approve-native-preview").onclick=submitNativePreviewCheckpoint}
    async function submitNativePreviewCheckpoint(){const button=$("approve-native-preview"),message=$("native-preview-message");button.disabled=true;message.textContent="正在确认并交付同一份 PPTX…";try{await json(`/api/workbench/runs/${currentRun.runId}/checkpoint/native-ppt`,{method:"POST"});currentRun=await json(`/api/workbench/runs/${currentRun.runId}`);await loadEvents();render();schedule()}catch(error){message.textContent=error.message;button.disabled=false}}
    function renderArtifacts(){const panel=$("artifacts-panel"),target=$("artifacts");if(!currentRun.artifacts?.length){panel.hidden=true;lastArtifactSignature="";return}panel.hidden=false;const markup=currentRun.artifacts.map(item=>{const href=`/api/workbench/runs/${currentRun.runId}/artifact?path=${encodeURIComponent(item.path)}`;return item.kind==="image"?`<a class="artifact" href="${href}" target="_blank"><img src="${href}" alt="${esc(item.label)}"><strong>${esc(item.label)}</strong></a>`:`<a class="artifact file" href="${href}" target="_blank"><strong>${esc(item.label)} ↗</strong></a>`}).join("");if(markup!==lastArtifactSignature){target.innerHTML=markup;lastArtifactSignature=markup}}
    function section(title,value,plain=false){if(value==null||value==="")return"";const content=plain?`<div class="text">${esc(value)}</div>`:`<pre>${esc(JSON.stringify(value,null,2))}</pre>`;return`<section class="detail-section"><h4>${esc(title)}</h4>${content}</section>`}
    async function showDetail(sequence,node){document.querySelectorAll(".event.active").forEach(item=>item.classList.remove("active"));node.classList.add("active");$("detail").innerHTML='<div class="detail-empty">读取真实记录…</div>';const detail=await trace({sequence});$("detail-hint").textContent=`${detail.source} · ${detail.status}`;$("detail").innerHTML=(detail.error?`<div class="error-box">${esc(detail.error.message||detail.error)}</div>`:"")+section("角色",detail.role,true)+section("任务 / 系统要求",detail.task,true)+section("实际 API 请求",detail.request)+section("阶段输入",detail.input)+section("工作上下文",detail.context)+section("输出 Schema",detail.outputSchema)+section("阶段输出",detail.output)+section("API 原始响应",detail.response)+section("Token 使用",detail.usage)}
    $("file").onchange=event=>chooseFile(event.target.files[0]);$("run").onclick=start;$("new-task").onclick=showNewTask;$("select-all-runs").onchange=event=>{for(const run of runSummaries){if(run.runId===activeRunId)continue;if(event.target.checked)selectedRunIds.add(run.runId);else selectedRunIds.delete(run.runId)}document.querySelectorAll("[data-select-run]:not(:disabled)").forEach(input=>{input.checked=event.target.checked});syncRunSelectionControls()};$("delete-selected-runs").onclick=deleteSelectedRuns;$("delete-all-runs").onclick=deleteAllRuns;const drop=$("drop");["dragenter","dragover"].forEach(name=>drop.addEventListener(name,event=>{event.preventDefault();drop.classList.add("drag")}));["dragleave","drop"].forEach(name=>drop.addEventListener(name,event=>{event.preventDefault();drop.classList.remove("drag")}));drop.addEventListener("drop",event=>chooseFile(event.dataTransfer.files[0]));boot().catch(error=>{document.body.innerHTML=`<pre style="padding:30px">${esc(error.stack||error.message)}</pre>`})
  </script>
