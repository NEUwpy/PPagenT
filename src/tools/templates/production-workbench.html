    .compare{display:none;margin-top:6px}.compare.visible{display:block}
    .compare-bar{display:grid;grid-template-columns:1fr 1fr auto;gap:12px;align-items:end;margin-bottom:16px;padding:14px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.85)}

    .compare-bar select{width:100%;border:1px solid #c9d5e3;border-radius:8px;padding:8px;font-size:12px;background:#fff}
    .compare-bar button{border:0;border-radius:9px;background:var(--blue);color:#fff;font-weight:700;padding:10px 16px;height:38px}
    .compare-bar button.ghost{background:#fff;color:var(--blue);border:1px solid #b7c9dc}
    .compare-grid{display:grid;grid-template-columns:minmax(230px,.55fr) minmax(0,1.45fr);gap:14px}
    .compare-card{border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.9);overflow:hidden;min-width:0}
    .compare-card h4{margin:0;padding:11px 14px;background:#f5f8fb;font-size:12px;color:#53647a}
    .compare-card .compare-body{padding:12px;display:grid;gap:10px;max-height:72vh;overflow:auto}
    .compare-step{display:grid;gap:3px;border:1px solid #e3e9f1;border-radius:10px;padding:9px 11px;font-size:12px;background:#fbfcfe;cursor:pointer;text-align:left;width:100%}
    .compare-step:hover{background:#fff}.compare-step.active{border-color:#7ea5d1;background:#fff;box-shadow:0 0 0 2px rgba(78,128,184,.1)}
    .compare-step small{color:var(--muted);font-size:10px}
    .compare-pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
    .compare-pair .compare-card .compare-body{max-height:60vh}
    .compare-files{display:grid;gap:8px}
    .compare-file{border:1px solid #e3e9f1;border-radius:10px;background:#fff;overflow:hidden}
    .compare-file>summary{padding:9px 11px;font-size:12px;cursor:pointer;color:var(--blue)}
    .compare-file-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:#e3e9f1;border-top:1px solid #e3e9f1}
    .compare-file-side{background:#fff;min-width:0;max-height:420px;overflow:auto}
    .compare-file-side h5{margin:0;padding:7px 10px;font-size:10px;color:var(--muted);background:#f8fafc;border-bottom:1px solid #edf1f6;position:sticky;top:0}
    .compare-file-side pre{margin:0;padding:9px 10px;font:11px/1.5 Consolas,"Microsoft YaHei",monospace;white-space:pre-wrap;word-break:break-word}
    .diff-del{background:#ffe9eb}.diff-add{background:#e8f7ee}
    .diff-del>span,.diff-add>span{display:block}
    .compare-note{padding:14px;color:var(--muted);font-size:12px;line-height:1.7}
    .lightbox{position:fixed;inset:0;z-index:99;display:grid;place-items:center;background:rgba(10,18,30,.88);cursor:zoom-out}
    .lightbox img{max-width:94vw;max-height:90vh;background:#fff;border-radius:6px;box-shadow:0 30px 90px rgba(0,0,0,.55);cursor:default}
    .lightbox-close{position:fixed;right:22px;top:18px;width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.14);color:#fff;font-size:22px;line-height:1;cursor:pointer}
    .lightbox-close:hover{background:rgba(255,255,255,.3)}
    .lightbox-hint{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);color:rgba(255,255,255,.78);font-size:12px}
    img.zoomable,.gray-preview-image{cursor:zoom-in}
    .gray-preview-nav button#gray-preview-zoom{margin-left:auto}
    @media(max-width:1180px){.gray-cols{grid-template-columns:1fr 1fr}.compare-grid{grid-template-columns:1fr}.compare-bar{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="app">
    <aside class="side"><div class="brand"><div class="mark"></div><div><strong>PPagenT</strong><small>正式生成工作台</small></div></div><button id="new-task" class="new-task-button" type="button">＋ 新建任务</button><h3>最近运行</h3><div class="run-tools"><label class="select-all-runs"><input id="select-all-runs" type="checkbox"><span>全选当前列表</span></label><button id="delete-selected-runs" type="button" disabled>删除所选</button><button id="delete-all-runs" class="danger" type="button" disabled>清空全部可删记录</button></div><div id="run-list" class="run-list"></div></aside>
    <main>
      <header class="topbar"><div><h1>PPagenT 正式生成工作台</h1><p>默认走灰稿线：稿件 → 灰稿，停在等待审阅；每一步可查提示词、模型响应与检查。</p></div><div class="env"><div id="env"></div><button id="compare-open" class="chip compare-button" type="button">⇄ 对比运行</button></div></header>
      <section class="new-run">
        <label id="drop" class="drop"><input id="file" type="file" accept=".docx,.md,.markdown,.txt"><div class="drop-icon">＋</div><div><b id="file-name">选择或拖入稿件</b><span>DOCX、Markdown 或 TXT</span></div></label>
        <div class="checkpoint-option">
          <label class="pipeline-pick"><span><b>生成线</b></span><select id="pipeline"><option value="gray">灰稿线（现行 M1）</option></select><span id="pipeline-note" class="pipeline-note"></span></label>
          <label class="pipeline-pick" id="area-pick"><span><b>灰稿区尺寸（设计像素）</b></span><div class="area-inputs"><input id="area-width" type="number" min="240" max="4000" value="1170" title="宽"><span>×</span><input id="area-height" type="number" min="240" max="4000" value="492" title="高"></div><input id="area-label" type="text" value="内容区" maxlength="60" placeholder="尺寸标签" style="width:100%;margin-top:6px;border:1px solid #c9d5e3;border-radius:8px;padding:7px 8px;color:var(--ink);font-size:11px"><span class="pipeline-note">灰稿正文区的设计尺寸；1170×492 为实验常用口径，可随时改。续跑沿用首次记录的尺寸。</span></label>
          <label class="pipeline-pick"><span><b>这次运行的性质</b></span><select id="purpose"><option value="production">正式</option><option value="verification">验证</option></select><span class="pipeline-note">验证运行走完全相同的阶段与记账，只是留个标记备查——它和正式运行一样保留在列表里，不会被单独清掉。</span></label>
          <label class="checkpoint-toggle" id="checkpoint-toggle"><input id="manual-checkpoint" type="checkbox"><span><b>调试时暂停表单</b><span>可选查看或修改视觉模型填写的页面职责、节奏和资产方案；正式生成默认自动继续。只有旧 API 生产线支持它。</span></span></label>
        </div>
        <button id="run" class="run-button" disabled>开始生成</button>
      </section>
      <section id="empty" class="empty">选择稿件开始运行，或从左侧打开历史运行。</section>
      <section id="workspace" class="workspace">
        <div class="summary"><div><h2 id="run-title"></h2><div id="run-meta" class="summary-meta"></div></div><div id="run-state" class="chip"></div></div>
        <div id="run-controls"></div><div class="meter"><i id="meter"></i></div><div id="stage-strip" class="pipeline"></div>
        <section class="panel stage-reader"><div class="panel-head"><h3 id="reader-title">生成步骤</h3><span id="reader-status"></span></div><div id="reader" class="stage-reader-body"><div class="reader-empty">点击上方任一步骤查看</div></div></section>
        <details class="panel debug-panel"><summary>原始运行记录与调试细节（默认收起）</summary><div class="grid"><section class="panel"><div class="panel-head"><h3 id="events-title">真实流转记录</h3><span id="event-count"></span></div><div id="events" class="events"></div></section><section class="panel"><div class="panel-head"><h3>单条原始记录</h3><span id="detail-hint">点击左侧记录查看</span></div><div id="detail" class="detail"><div class="detail-empty">尚未选择记录</div></div></section></div></details>
        <section id="artifacts-panel" class="panel artifacts" hidden><div class="panel-head"><h3>生成结果</h3><span>同一条生成线的 Renderer 产物</span></div><div id="artifacts" class="artifact-grid"></div></section>
      </section>
      <section id="compare" class="compare">
        <div class="compare-bar">
          <label><span>运行 A（左）</span><select id="compare-a"></select></label>
          <label><span>运行 B（右）</span><select id="compare-b"></select></label>
          <div style="display:flex;gap:8px"><button id="compare-load" type="button">开始对比</button><button id="compare-close" class="ghost" type="button">关闭</button></div>
        </div>
        <div id="compare-body"><div class="compare-note">选择两条运行后点「开始对比」。典型用法：同一份稿件用两版提示词各跑一次，进门看每一步的提示词、模型响应、程序检查与灰稿页的差异。两侧的文件按标签自动配对，差异行左删右增着色。</div></div>
      </section>
    </main>
  </div>
  <script>
    const LEGACY_STAGES=[
      ["manuscript-normalization","稿件进入","原文件 → 规范化 Markdown"],
      ["content-director","内容导演","整套叙事、拆页与逐页内容稿"],
      ["shell-scaffold","页面壳","封面、目录、正文与尾页"],
      ["visual-candidates","资产候选","按 Logic 找合法核心资产"],
      ["visual-director","视觉导演","选资产、排版并填写程序表单"],
      ["visual-resolution","确定性解析","校验、State、绑定与载荷"],
      ["native-preview","PPT 排版预览","直接生成暂存 PPTX、逐页渲染与质量门禁"],
      ["delivery","PPT 交付","确认后交付同一份 PPTX，不再排版"]
    ];
    const LEGACY_HANDOFFS={
      "manuscript-normalization":"程序读取上传文件并统一转为 Markdown。这里不调用模型；输出全文会原样交给内容导演。",
      "content-director":"内容导演一次读取全文；每个 H1 就是一页，H2/H3 与列表形成页内内容。程序再编译 DeckPlan / PageContent。其输出不决定视觉资产，随后交给页面壳与视觉候选发现。",
      "shell-scaffold":"确定性程序补齐封面、目录、正文和尾页角色，不修改正文语义，随后为每个正文页准备视觉候选。",
      "visual-candidates":"程序依据内容导演识别的 Logic、容量和核心资产契约列出合法候选；这一步不调用模型，也不强行跨 Logic。",
      "visual-director":"视觉导演同时拿逐页内容稿与合法资产清单，填写结构、Composition、文字区域等正式表单。若本次开启人工检查，就在这里暂停修改同一份输出。",
      "visual-resolution":"程序验证视觉导演表单，确定 State、内容绑定与组件载荷。人工修改也走这一个解析器，不另建手动生成线。",
      "native-preview":"程序直接在原始 Skin 模板上排版并生成暂存 Native PPTX，再把这份 PPTX 渲染成逐页图片。这里不调用模型，也不生成整套 HTML。",
      "delivery":"确认后只把已经看过的暂存 PPTX 复制到交付目录；不再选择资产、不再排版、不再编译。"
    };
    // 两条生成线的阶段不是同一套：阶段表跟着当前运行走，不拿旧线的八段去套薄运行器的四段。
    let stages=LEGACY_STAGES,handoffs=LEGACY_HANDOFFS;
    const labels={"stage-call":"阶段调用","api-call":"模型 API","tool-call":"工具调用","manual-checkpoint":"可选表单暂停","delivery":"交付"};
    let config=null,file=null,currentRun=null,events=[],selectedStage=null,pollTimer=null,readerToken=0,checkpointDraft=null,lastViewSignature=null,lastReaderSignature=null,lastRunListSignature=null,lastPipelineSignature=null,lastEventListSignature=null,lastArtifactSignature=null,lastControlsSignature=null,activeRunId=null,runSummaries=[],deletableRunCount=0,previewPageIndex=0,previewRunId=null;
    const selectedRunIds=new Set();
    const traceCache=new Map();const $=id=>document.getElementById(id);const esc=value=>String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    const ms=value=>value==null?"—":value<1000?`${value} ms`:`${(value/1000).toFixed(1)} s`;
    async function json(url,options){const response=await fetch(url,options);const value=await response.json();if(!response.ok)throw new Error(value.error||`HTTP ${response.status}`);return value}
    function statusText(status){return ({normalizing:"稿件转换中",running:"生成中","awaiting-user-review":"等待审阅灰稿","awaiting-visual-approval":"等待检查视觉方案","awaiting-native-preview-approval":"等待确认 PPT 预览",succeeded:"已完成",stopped:"已停止 · 未交付",failed:"失败",cancelled:"已取消"})[status]||status}
    let grayFileCache=new Map(),lastGrayReaderSignature=null,grayPreviewIndex=0,grayPreviewRunId=null,compareState=null,readerRevision=null;
    // 生成线切换：薄运行器与灰稿线都没有人工检查点，勾选项在这里被禁用，而不是让后端静默忽略它。
    function syncPipelineControls(){const value=$("pipeline").value;const info=config?.pipelines?.[value];const note=$("pipeline-note");if(note)note.textContent=info?.note||"";const toggle=$("checkpoint-toggle");const box=$("manual-checkpoint");if(box){const supported=info?.checkpoint!==false;box.disabled=!supported;if(!supported)box.checked=false;if(toggle)toggle.classList.toggle("disabled",!supported)}const area=$("area-pick");if(area)area.style.display=value==="gray"?"":"none"}
    async function boot(){config=await json("/api/workbench/config");$("env").innerHTML=`<span class="chip">主题 · ${esc(config.skin.name)}</span><span class="chip">模型 · ${esc(config.provider.model)}</span><span class="chip">API ${config.provider.configured?"已配置":"未配置"}</span>`;if(config?.pipelines?.default)$("pipeline").value=config.pipelines.default;syncPipelineControls();await refreshRuns()}
    function syncRunSelectionControls(){const deletableVisible=runSummaries.filter(run=>run.runId!==activeRunId);const selectedVisible=deletableVisible.filter(run=>selectedRunIds.has(run.runId));const selectAll=$("select-all-runs");selectAll.disabled=!deletableVisible.length;selectAll.checked=Boolean(deletableVisible.length)&&selectedVisible.length===deletableVisible.length;selectAll.indeterminate=selectedVisible.length>0&&selectedVisible.length<deletableVisible.length;$("delete-selected-runs").disabled=!selectedRunIds.size;$("delete-selected-runs").textContent=selectedRunIds.size?`删除所选（${selectedRunIds.size}）`:"删除所选";$("delete-all-runs").disabled=!deletableRunCount;$("delete-all-runs").textContent=deletableRunCount?`清空全部可删记录（${deletableRunCount}）`:"清空全部可删记录"}
    async function refreshRuns(){const data=await json("/api/workbench/runs");activeRunId=data.activeRunId||null;runSummaries=data.runs||[];deletableRunCount=data.deletableRunCount||0;const visibleDeletable=new Set(runSummaries.filter(run=>run.runId!==activeRunId).map(run=>run.runId));for(const runId of selectedRunIds){if(!visibleDeletable.has(runId))selectedRunIds.delete(runId)}const signature=JSON.stringify({activeRunId,currentRunId:currentRun?.runId||null,selected:[...selectedRunIds].sort(),runs:runSummaries.map(run=>[run.runId,run.originalName,run.status,run.createdAt,run.purpose||null])});if(signature!==lastRunListSignature){$("run-list").innerHTML=runSummaries.map(run=>`<div class="run-row ${currentRun?.runId===run.runId?"active":""}"><label class="run-select" title="选择这次运行"><input type="checkbox" data-select-run="${run.runId}" ${selectedRunIds.has(run.runId)?"checked":""} ${activeRunId===run.runId?"disabled":""}></label><button class="run-item" data-run="${run.runId}"><b>${esc(run.originalName)}</b>${run.purpose==="verification"?'<i class="badge verification">验证</i>':""}<span><i><em class="status-dot ${run.status}"></em>${statusText(run.status)}</i><time>${new Date(run.createdAt).toLocaleString()}</time></span></button><button class="run-delete" data-delete-run="${run.runId}" data-delete-name="${esc(run.originalName)}" title="删除这次运行及全部后端记录" aria-label="删除 ${esc(run.originalName)}" ${activeRunId===run.runId?"disabled":""}>×</button></div>`).join("")||'<div style="padding:10px;color:#8a96a7;font-size:12px">还没有运行记录</div>';document.querySelectorAll("[data-run]").forEach(button=>button.onclick=()=>openRun(button.dataset.run));document.querySelectorAll("[data-delete-run]").forEach(button=>button.onclick=()=>deleteRunRecord(button.dataset.deleteRun,button.dataset.deleteName));document.querySelectorAll("[data-select-run]").forEach(input=>input.onchange=()=>{if(input.checked)selectedRunIds.add(input.dataset.selectRun);else selectedRunIds.delete(input.dataset.selectRun);lastRunListSignature=null;syncRunSelectionControls()});lastRunListSignature=signature}syncRunSelectionControls()}
    async function applyDeletedRuns(result,message){const deleted=new Set(result.deletedRunIds||[]);for(const runId of deleted)selectedRunIds.delete(runId);lastRunListSignature=null;if(currentRun&&deleted.has(currentRun.runId)){clearTimeout(pollTimer);currentRun=null;events=[];selectedStage=null;traceCache.clear();checkpointDraft=null;lastViewSignature=null;lastReaderSignature=null;lastPipelineSignature=null;lastEventListSignature=null;lastArtifactSignature=null;lastControlsSignature=null;previewPageIndex=0;previewRunId=null;$("workspace").classList.remove("visible");$("empty").style.display="block";$("empty").textContent=message;if(result.currentRunId)await openRun(result.currentRunId);else await refreshRuns()}else await refreshRuns()}
    async function deleteRunRecord(runId,name){if(activeRunId===runId)return;const confirmed=window.confirm(`确定删除“${name}”这次运行吗？\n\n输入稿件副本、API 事件、所有中间记录、预览和交付文件都会永久删除。`);if(!confirmed)return;try{const result=await json(`/api/workbench/runs/${runId}`,{method:"DELETE"});await applyDeletedRuns(result,"这次运行及其全部后端记录已经删除。") }catch(error){alert(error.message)}}
    async function deleteSelectedRuns(){const runIds=[...selectedRunIds];if(!runIds.length)return;const confirmed=window.confirm(`确定永久删除选中的 ${runIds.length} 次运行吗？\n\n这些运行的输入副本、API 事件、中间记录、预览和交付文件都会一起删除。`);if(!confirmed)return;try{const result=await json("/api/workbench/runs/batch-delete",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({runIds})});await applyDeletedRuns(result,`选中的 ${result.deletedRunIds.length} 次运行及其全部后端记录已经删除。`)}catch(error){alert(error.message)}}
    async function deleteAllRuns(){if(!deletableRunCount)return;const confirmed=window.confirm(`确定永久删除全部 ${deletableRunCount} 条可删运行吗？\n\n这会遍历完整后端记录目录，不只删除左侧当前显示的记录；正在计算或交付的任务会保留，等待确认的任务会取消后删除。`);if(!confirmed)return;try{const result=await json("/api/workbench/runs/batch-delete",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({mode:"all-deletable"})});await applyDeletedRuns(result,`全部 ${result.deletedRunIds.length} 条可删运行及其后端记录已经删除。`)}catch(error){alert(error.message)}}
    function isActive(){return Boolean(activeRunId)}
    function showNewTask(){clearTimeout(pollTimer);currentRun=null;stages=LEGACY_STAGES;handoffs=LEGACY_HANDOFFS;events=[];selectedStage=null;traceCache.clear();grayFileCache=new Map();lastGrayReaderSignature=null;grayPreviewIndex=0;grayPreviewRunId=null;checkpointDraft=null;lastViewSignature=null;lastReaderSignature=null;lastRunListSignature=null;lastPipelineSignature=null;lastEventListSignature=null;lastArtifactSignature=null;lastControlsSignature=null;previewPageIndex=0;previewRunId=null;file=null;$("file").value="";$("file-name").textContent="选择或拖入稿件";$("workspace").classList.remove("visible");$("empty").style.display="block";$("empty").textContent=activeRunId?"当前任务仍在生成；完成或进入等待确认后即可开始新任务。":"选择稿件开始一个新任务。";$("run").disabled=true;window.scrollTo({top:0,behavior:"smooth"})}
    function chooseFile(next){file=next||null;$("file-name").textContent=file?file.name:"选择或拖入稿件";$("run").disabled=!file||isActive()}
    async function start(){if(!file)return;$("run").disabled=true;try{const mode=$("manual-checkpoint").checked?"manual":"auto";const pipeline=$("pipeline").value;const purpose=$("purpose").value;const params=new URLSearchParams({filename:file.name,visualCheckpoint:mode,pipeline,purpose});if(pipeline==="gray"){params.set("areaWidth",$("area-width").value);params.set("areaHeight",$("area-height").value);if($("area-label").value.trim())params.set("areaLabel",$("area-label").value.trim())}const response=await fetch(`/api/workbench/runs?${params.toString()}`,{method:"POST",headers:{"content-type":"application/octet-stream"},body:file});const value=await response.json();if(!response.ok)throw new Error(value.error||"创建运行失败");await openRun(value.runId)}catch(error){alert(error.message);$("run").disabled=false}}

    function diffLines(leftText,rightText){
      const a=leftText.split("\n"),b=rightText.split("\n");

      const outA=[],outB=[];let i=0,j=0;
      while(i<n&&j<m){
        if(a[i]===b[j]){outA.push(["same",a[i]]);outB.push(["same",b[j]]);i+=1;j+=1}
        else if(dp[i+1][j]>=dp[i][j+1]){outA.push(["del",a[i]]);i+=1}
        else{outB.push(["add",b[j]]);j+=1}
      }
      while(i<n){outA.push(["del",a[i]]);i+=1}
      while(j<m){outB.push(["add",b[j]]);j+=1}
      const render=rows=>rows.map(([type,text])=>`<span class="${type==="same"?"":type==="del"?"diff-del":"diff-add"}">${esc(text)}</span>`).join("");
      return{left:render(outA),right:render(outB)};
    }

    function renderArtifacts(){const panel=$("artifacts-panel"),target=$("artifacts");if(!currentRun.artifacts?.length){panel.hidden=true;lastArtifactSignature="";return}panel.hidden=false;const markup=currentRun.artifacts.map(item=>{const href=`/api/workbench/runs/${currentRun.runId}/artifact?path=${encodeURIComponent(item.path)}`;return item.kind==="image"?`<button class="artifact" type="button" data-zoom-src="${href}" data-zoom-alt="${esc(item.label)}"><img src="${href}" alt="${esc(item.label)}" loading="lazy"><strong>${esc(item.label)}</strong><span class="artifact-hint">点击放大查看</span></button>`:`<a class="artifact file" href="${href}" target="_blank"><strong>${esc(item.label)} ↗</strong></a>`}).join("");if(markup!==lastArtifactSignature){target.innerHTML=markup;lastArtifactSignature=markup}}

    async function showDetail(sequence,node){document.querySelectorAll(".event.active").forEach(item=>item.classList.remove("active"));node.classList.add("active");$("detail").innerHTML='<div class="detail-empty">读取真实记录…</div>';const detail=await trace({sequence});$("detail-hint").textContent=`${detail.source} · ${detail.status}`;$("detail").innerHTML=(detail.error?`<div class="error-box">${esc(detail.error.message||detail.error)}</div>`:"")+section("角色",detail.role,true)+section("任务 / 系统要求",detail.task,true)+section("实际 API 请求",detail.request)+section("阶段输入",detail.input)+section("工作上下文",detail.context)+section("输出 Schema",detail.outputSchema)+section("阶段输出",detail.output)+section("API 原始响应",detail.response)+section("Token 使用",detail.usage)}
    $("file").onchange=event=>chooseFile(event.target.files[0]);$("run").onclick=start;$("new-task").onclick=showNewTask;$("pipeline").onchange=syncPipelineControls;$("compare-open").onclick=openCompare;$("compare-close").onclick=closeCompare;$("compare-load").onclick=loadCompare;
    // 放大查看：生成结果里的图片卡片、灰稿预览大图与对比页图片点开后进页内弹层，点空白或叉或 Esc 关闭；不再另开页面。
    document.addEventListener("click",event=>{const card=event.target.closest?.("[data-zoom-src]");if(card&&!event.target.closest("#lightbox")){openLightbox(card.dataset.zoomSrc,card.dataset.zoomAlt);return}const image=event.target.closest?.("img.zoomable");if(image&&!event.target.closest("#lightbox"))openLightbox(image.src,image.alt)});$("select-all-runs").onchange=event=>{for(const run of runSummaries){if(run.runId===activeRunId)continue;if(event.target.checked)selectedRunIds.add(run.runId);else selectedRunIds.delete(run.runId)}document.querySelectorAll("[data-select-run]:not(:disabled)").forEach(input=>{input.checked=event.target.checked});syncRunSelectionControls()};$("delete-selected-runs").onclick=deleteSelectedRuns;$("delete-all-runs").onclick=deleteAllRuns;const drop=$("drop");["dragenter","dragover"].forEach(name=>drop.addEventListener(name,event=>{event.preventDefault();drop.classList.add("drag")}));["dragleave","drop"].forEach(name=>drop.addEventListener(name,event=>{event.preventDefault();drop.classList.remove("drag")}));drop.addEventListener("drop",event=>chooseFile(event.dataTransfer.files[0]));boot().catch(error=>{document.body.innerHTML=`<pre style="padding:30px">${esc(error.stack||error.message)}</pre>`})
  </script>
