<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PPagenT 正式生成工作台</title>
  <style>
    :root{--ink:#172338;--muted:#6b778a;--line:#dbe3ee;--panel:#fff;--wash:#f3f6fa;--blue:#285c9f;--blue2:#6d9bd2;--green:#258064;--red:#c14852;--amber:#b27a28;--shadow:0 18px 48px rgba(31,50,76,.10)}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Microsoft YaHei","Segoe UI",sans-serif;color:var(--ink);background:#edf2f7}button,input{font:inherit}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 8% 0%,rgba(82,128,184,.16),transparent 28%),radial-gradient(circle at 100% 18%,rgba(105,155,210,.12),transparent 24%)}
    .app{position:relative;display:grid;grid-template-columns:280px minmax(0,1fr);min-height:100vh}.side{padding:26px 20px;border-right:1px solid rgba(255,255,255,.65);background:rgba(247,249,252,.84);backdrop-filter:blur(18px)}
    .brand{display:flex;align-items:center;gap:12px;margin-bottom:28px}.mark{width:42px;height:42px;border-radius:13px;background:linear-gradient(145deg,#244d82,#6b9ed5);box-shadow:0 10px 22px rgba(42,88,145,.25);position:relative}.mark:after{content:"";position:absolute;left:10px;right:10px;top:20px;height:2px;background:#fff;box-shadow:0 -7px #fff,0 7px #fff;transform:skewX(-18deg)}
    .brand strong{font-size:18px}.brand small{display:block;color:var(--muted);margin-top:3px}.side h3{margin:24px 8px 10px;font-size:12px;letter-spacing:.12em;color:#8b97a8}.run-list{display:flex;flex-direction:column;gap:7px}.run-item{border:0;text-align:left;padding:11px 12px;border-radius:12px;background:transparent;color:var(--ink);cursor:pointer}.run-item:hover,.run-item.active{background:#fff;box-shadow:0 8px 22px rgba(40,65,98,.08)}.run-item b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}.run-item span{display:flex;justify-content:space-between;margin-top:6px;color:var(--muted);font-size:11px}
    .status-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;background:#a2adbb}.status-dot.running{background:var(--amber);box-shadow:0 0 0 4px rgba(178,122,40,.11)}.status-dot.succeeded{background:var(--green)}.status-dot.failed{background:var(--red)}
    main{padding:28px 30px 60px;min-width:0}.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:22px}.topbar h1{font-size:28px;margin:0 0 6px;letter-spacing:-.04em}.topbar p{margin:0;color:var(--muted);font-size:14px}.env{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.chip{padding:7px 10px;border:1px solid var(--line);background:rgba(255,255,255,.72);border-radius:999px;color:#536174;font-size:12px}
    .new-run{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;padding:18px;background:rgba(255,255,255,.82);border:1px solid rgba(255,255,255,.9);border-radius:18px;box-shadow:var(--shadow);margin-bottom:22px}.drop{position:relative;display:flex;align-items:center;gap:14px;min-height:76px;border:1.5px dashed #b6c6da;border-radius:14px;padding:14px 18px;background:#f8fafc;cursor:pointer}.drop.drag{border-color:var(--blue);background:#eff5fc}.drop input{position:absolute;inset:0;opacity:0;cursor:pointer}.drop-icon{width:42px;height:42px;border-radius:12px;background:#e3edf8;color:var(--blue);display:grid;place-items:center;font-size:22px;font-weight:300}.drop b{font-size:14px}.drop span{display:block;color:var(--muted);font-size:12px;margin-top:5px}.run-button{border:0;border-radius:14px;padding:0 24px;background:linear-gradient(135deg,#244f87,#4d82bd);color:#fff;font-weight:700;cursor:pointer;box-shadow:0 12px 26px rgba(39,83,137,.22)}.run-button:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
    .empty{padding:70px 20px;text-align:center;color:var(--muted);background:rgba(255,255,255,.62);border:1px solid rgba(255,255,255,.9);border-radius:18px}.workspace{display:none}.workspace.visible{display:block}.summary{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:8px}.summary h2{margin:0;font-size:19px}.summary-meta,.debug-entry{color:var(--muted);font-size:12px}.debug-entry{margin-bottom:14px;font-family:Consolas,"Microsoft YaHei",monospace}.meter{height:5px;border-radius:99px;background:#dfe6ef;overflow:hidden;margin:9px 0 20px}.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#6d9bd2,#285c9f);transition:width .3s}
    .pipeline{display:grid;grid-template-columns:repeat(7,minmax(116px,1fr));gap:9px;margin-bottom:18px}.stage{position:relative;border:1px solid var(--line);border-radius:14px;padding:13px 12px;background:rgba(255,255,255,.76);min-height:96px;cursor:pointer}.stage:after{content:"";position:absolute;right:-10px;top:50%;width:10px;height:1px;background:#b7c3d2}.stage:last-child:after{display:none}.stage.active{border-color:#7ea5d1;box-shadow:0 0 0 2px rgba(78,128,184,.12)}.stage .num{font:700 11px/1 "Segoe UI";color:#9ba6b4}.stage h4{font-size:13px;margin:10px 0 6px}.stage p{margin:0;color:var(--muted);font-size:11px;line-height:1.5}.stage.succeeded{border-top:3px solid var(--green)}.stage.running{border-top:3px solid var(--amber)}.stage.failed{border-top:3px solid var(--red)}
    .grid{display:grid;grid-template-columns:minmax(300px,.82fr) minmax(420px,1.18fr);gap:16px}.panel{background:rgba(255,255,255,.88);border:1px solid rgba(255,255,255,.95);border-radius:17px;box-shadow:0 12px 36px rgba(39,60,88,.07);overflow:hidden}.panel-head{display:flex;justify-content:space-between;align-items:center;padding:15px 17px;border-bottom:1px solid var(--line)}.panel-head h3{margin:0;font-size:14px}.panel-head span{font-size:11px;color:var(--muted)}
    .events{max-height:580px;overflow:auto;padding:9px}.event{width:100%;border:0;background:transparent;text-align:left;padding:10px;border-radius:11px;cursor:pointer;display:grid;grid-template-columns:8px 1fr auto;gap:10px;align-items:start}.event:hover,.event.active{background:#edf3f9}.event i{width:8px;height:8px;border-radius:50%;margin-top:5px;background:#aab5c3}.event i.running{background:var(--amber)}.event i.succeeded{background:var(--green)}.event i.failed,.event i.invalid-output{background:var(--red)}.event b{display:block;font-size:12px}.event small{display:block;color:var(--muted);margin-top:4px;line-height:1.45}.event time{font-size:10px;color:#9aa5b4;white-space:nowrap}
    .detail{min-height:420px;max-height:580px;overflow:auto;padding:16px}.detail-empty{display:grid;place-items:center;min-height:360px;color:var(--muted);font-size:13px}.detail-section{margin-bottom:16px}.detail-section h4{margin:0 0 8px;font-size:12px;color:#617086}.detail-section pre{margin:0;padding:13px;border-radius:11px;background:#101a29;color:#dce7f5;white-space:pre-wrap;word-break:break-word;font:11px/1.55 Consolas,"Microsoft YaHei",monospace;max-height:320px;overflow:auto}.detail-section .text{padding:12px;border:1px solid var(--line);border-radius:11px;background:#f8fafc;font-size:12px;line-height:1.65;white-space:pre-wrap;word-break:break-word}
    .artifacts{margin-top:16px}.artifact-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;padding:14px}.artifact{display:block;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#f8fafc;color:var(--ink);text-decoration:none}.artifact img{display:block;width:100%;aspect-ratio:16/9;object-fit:contain;background:#e9eef5}.artifact strong{display:block;padding:10px 12px;font-size:12px}.artifact.file{padding:16px}.artifact.file strong{padding:0}.error-box{padding:12px 14px;border-radius:11px;background:#fff0f1;color:#a2333d;font-size:12px;margin-bottom:15px}
    @media(max-width:1180px){.pipeline{grid-template-columns:repeat(4,1fr)}.stage:after{display:none}.grid{grid-template-columns:1fr}}@media(max-width:760px){.app{display:block}.side{display:none}main{padding:18px}.new-run{grid-template-columns:1fr}.run-button{height:52px}.pipeline{grid-template-columns:repeat(2,1fr)}}
  </style>
</head>
<body>
  <div class="app">
    <aside class="side">
      <div class="brand"><div class="mark"></div><div><strong>PPagenT</strong><small>正式生成工作台</small></div></div>
      <h3>最近运行</h3><div id="run-list" class="run-list"></div>
    </aside>
    <main>
      <header class="topbar"><div><h1>把稿件交给正式生成线</h1><p>这里展示仓库中真实的内容导演、视觉导演、能力选择与渲染过程。</p></div><div id="env" class="env"></div></header>
      <section class="new-run">
        <label id="drop" class="drop"><input id="file" type="file" accept=".docx,.md,.markdown,.txt"><div class="drop-icon">＋</div><div><b id="file-name">选择或拖入稿件</b><span>DOCX、Markdown 或 TXT，规范化结果会先展示再进入正式流程</span></div></label>
        <button id="run" class="run-button" disabled>开始生成</button>
      </section>
      <section id="empty" class="empty">选择稿件开始第一次运行，或从左侧打开历史运行。</section>
      <section id="workspace" class="workspace">
        <div class="summary"><div><h2 id="run-title"></h2><div id="run-meta" class="summary-meta"></div></div><div id="run-state" class="chip"></div></div>
        <div id="debug-entry" class="debug-entry"></div>
        <div class="meter"><i id="meter"></i></div>
        <div id="pipeline" class="pipeline"></div>
        <div class="grid">
          <section class="panel"><div class="panel-head"><h3 id="events-title">真实流转记录</h3><span id="event-count"></span></div><div id="events" class="events"></div></section>
          <section class="panel"><div class="panel-head"><h3>输入 / 提示词 / API / 输出</h3><span id="detail-hint">点击左侧记录查看</span></div><div id="detail" class="detail"><div class="detail-empty">尚未选择记录</div></div></section>
        </div>
        <section id="artifacts-panel" class="panel artifacts" hidden><div class="panel-head"><h3>生成结果</h3><span>直接读取本次 Renderer 产物</span></div><div id="artifacts" class="artifact-grid"></div></section>
      </section>
    </main>
  </div>
  <script>
    const stages=[
      ["manuscript-normalization","稿件进入","原文件 → Markdown"],
      ["content-director","内容导演","叙事、拆页、Logic"],
      ["shell-scaffold","页面壳","封面、目录、正文、尾页"],
      ["visual-candidates","能力发现","核心资产合法候选"],
      ["visual-director","视觉导演","结构组与文字排版"],
      ["visual-resolution","确定性解析","State、绑定与载荷"],
      ["render","渲染交付","PPTX 与质量门禁"]
    ];
    const labels={"stage-call":"阶段调用","api-call":"模型 API","delivery":"交付"};
    let config=null,file=null,currentRun=null,events=[],selectedStage=null,pollTimer=null;
    const $=id=>document.getElementById(id); const esc=value=>String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    const ms=value=>value==null?"—":value<1000?`${value} ms`:`${(value/1000).toFixed(1)} s`;
    async function json(url,options){const response=await fetch(url,options);const value=await response.json();if(!response.ok)throw new Error(value.error||`HTTP ${response.status}`);return value}
    function statusText(status){return ({normalizing:"稿件转换中",running:"生成中",succeeded:"已完成",failed:"失败"})[status]||status}
    async function boot(){config=await json("/api/workbench/config");$("env").innerHTML=`<span class="chip">主题 · ${esc(config.skin.name)}</span><span class="chip">${esc(config.provider.name)} · ${esc(config.provider.model)}</span><span class="chip">API ${config.provider.configured?"已配置":"未配置"}</span>`;await refreshRuns();}
    async function refreshRuns(){const data=await json("/api/workbench/runs");$("run-list").innerHTML=data.runs.map(run=>`<button class="run-item ${currentRun?.runId===run.runId?"active":""}" data-run="${run.runId}"><b>${esc(run.originalName)}</b><span><i><em class="status-dot ${run.status}"></em>${statusText(run.status)}</i><time>${new Date(run.createdAt).toLocaleString()}</time></span></button>`).join("")||'<div style="padding:10px;color:#8a96a7;font-size:12px">还没有运行记录</div>';document.querySelectorAll("[data-run]").forEach(button=>button.onclick=()=>openRun(button.dataset.run));}
    function chooseFile(next){file=next||null;$("file-name").textContent=file?file.name:"选择或拖入稿件";$("run").disabled=!file||Boolean(currentRun&&["running","normalizing"].includes(currentRun.status));}
    async function start(){if(!file)return;$("run").disabled=true;try{const response=await fetch(`/api/workbench/runs?filename=${encodeURIComponent(file.name)}`,{method:"POST",headers:{"content-type":"application/octet-stream"},body:file});const value=await response.json();if(!response.ok)throw new Error(value.error||"创建运行失败");await openRun(value.runId)}catch(error){alert(error.message);$("run").disabled=false}}
    async function openRun(runId){clearTimeout(pollTimer);currentRun=await json(`/api/workbench/runs/${runId}`);events=[];selectedStage=null;$("empty").style.display="none";$("workspace").classList.add("visible");await loadEvents();render();await refreshRuns();schedule();}
    async function loadEvents(){const after=events.at(-1)?.sequence||0;const data=await json(`/api/workbench/runs/${currentRun.runId}/events?after=${after}`);events.push(...data.events)}
    function schedule(){clearTimeout(pollTimer);if(!["running","normalizing"].includes(currentRun.status))return;pollTimer=setTimeout(async()=>{try{currentRun=await json(`/api/workbench/runs/${currentRun.runId}`);await loadEvents();render();await refreshRuns();schedule()}catch{schedule()}},1000)}
    function stageInfo(stageId){const list=events.filter(event=>event.stage===stageId);const failed=list.some(event=>event.status==="failed");const running=list.some(event=>event.status==="running")&&!list.some(event=>event.status==="succeeded");const succeeded=list.some(event=>event.status==="succeeded");return{list,status:failed?"failed":running?"running":succeeded?"succeeded":"pending",calls:list.filter(event=>event.source==="model"&&event.type==="api-call"&&event.status==="running").length,duration:list.filter(event=>event.durationMs).reduce((sum,event)=>sum+event.durationMs,0)}}
    function render(){
      $("run-title").textContent=currentRun.originalName;$("run-meta").textContent=`${new Date(currentRun.createdAt).toLocaleString()} · ${currentRun.skin?.name||"东北大学"} · ${currentRun.provider?.model||config.provider.model} · 运行号 ${currentRun.runId}`;$("debug-entry").textContent="Codex 调试入口 · .tmp/production-workbench/current-run.json";$("run-state").textContent=statusText(currentRun.status);
      const done=stages.filter(([id])=>stageInfo(id).status==="succeeded").length;$("meter").style.width=`${Math.round(done/stages.length*100)}%`;
      $("pipeline").innerHTML=stages.map(([id,name,desc],index)=>{const info=stageInfo(id);return`<div class="stage ${info.status} ${selectedStage===id?"active":""}" data-stage="${id}"><span class="num">0${index+1}</span><h4>${name}</h4><p>${desc}<br>${info.calls?`${info.calls} 次 API · `:""}${info.duration?ms(info.duration):""}</p></div>`}).join("");document.querySelectorAll("[data-stage]").forEach(node=>node.onclick=()=>{selectedStage=node.dataset.stage;render()});
      const shown=selectedStage?events.filter(event=>event.stage===selectedStage):events;$("events-title").textContent=selectedStage?(stages.find(item=>item[0]===selectedStage)?.[1]||selectedStage):"真实流转记录";$("event-count").textContent=`${shown.length} 条 · API 共 ${events.filter(e=>e.source==="model"&&e.type==="api-call"&&e.status==="running").length} 次`;
      $("events").innerHTML=shown.map(event=>`<button class="event" data-event="${event.sequence}"><i class="${event.status}"></i><span><b>${labels[event.type]||event.type} · ${esc(event.stage)}</b><small>${event.source==="model"?`${esc(event.provider)} ${esc(event.model)} · 第 ${event.attempt} 次尝试`:event.status}${event.error?.message?` · ${esc(event.error.message)}`:""}</small></span><time>${event.durationMs!=null?ms(event.durationMs):new Date(event.timestamp).toLocaleTimeString()}</time></button>`).join("")||'<div class="detail-empty">该阶段还没有记录</div>';document.querySelectorAll("[data-event]").forEach(node=>node.onclick=()=>showDetail(Number(node.dataset.event),node));
      renderArtifacts();$("run").disabled=!file||["running","normalizing"].includes(currentRun.status);
    }
    function renderArtifacts(){const panel=$("artifacts-panel"),target=$("artifacts");if(!currentRun.artifacts?.length){panel.hidden=true;return}panel.hidden=false;target.innerHTML=currentRun.artifacts.map(item=>{const href=`/api/workbench/runs/${currentRun.runId}/artifact?path=${encodeURIComponent(item.path)}`;return item.kind==="image"?`<a class="artifact" href="${href}" target="_blank"><img src="${href}" alt="${esc(item.label)}"><strong>${esc(item.label)}</strong></a>`:`<a class="artifact file" href="${href}" target="_blank"><strong>${esc(item.label)} ↗</strong></a>`}).join("")}
    function section(title,value,plain=false){if(value==null||value==="")return"";const content=plain?`<div class="text">${esc(value)}</div>`:`<pre>${esc(JSON.stringify(value,null,2))}</pre>`;return`<section class="detail-section"><h4>${esc(title)}</h4>${content}</section>`}
    async function showDetail(sequence,node){document.querySelectorAll(".event.active").forEach(item=>item.classList.remove("active"));node.classList.add("active");$("detail").innerHTML='<div class="detail-empty">读取真实记录…</div>';const detail=await json(`/api/workbench/runs/${currentRun.runId}/trace/event-${String(sequence).padStart(4,"0")}`);$("detail-hint").textContent=`${detail.source} · ${detail.status}`;$("detail").innerHTML=(detail.error?`<div class="error-box">${esc(detail.error.message||detail.error)}</div>`:"")+section("角色",detail.role,true)+section("任务 / 系统要求",detail.task,true)+section("实际 API 请求",detail.request)+section("阶段输入",detail.input)+section("工作上下文",detail.context)+section("输出 Schema",detail.outputSchema)+section("阶段输出",detail.output)+section("API 原始响应",detail.response)+section("Token 使用",detail.usage);}
    $("file").onchange=event=>chooseFile(event.target.files[0]);$("run").onclick=start;const drop=$("drop");["dragenter","dragover"].forEach(name=>drop.addEventListener(name,event=>{event.preventDefault();drop.classList.add("drag")}));["dragleave","drop"].forEach(name=>drop.addEventListener(name,event=>{event.preventDefault();drop.classList.remove("drag")}));drop.addEventListener("drop",event=>chooseFile(event.dataTransfer.files[0]));boot().catch(error=>{document.body.innerHTML=`<pre style="padding:30px">${esc(error.stack||error.message)}</pre>`});
  </script>
</body>
</html>
