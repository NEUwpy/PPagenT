<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>PPagenT 正式生成工作台</title>
  <style>
    :root{--ink:#172338;--muted:#6b778a;--line:#dbe3ee;--panel:#fff;--wash:#f3f6fa;--blue:#285c9f;--blue-soft:#edf4fb;--green:#258064;--red:#c14852;--amber:#b27a28;--shadow:0 18px 48px rgba(31,50,76,.10)}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Microsoft YaHei","Segoe UI",sans-serif;color:var(--ink);background:#edf2f7}button,input,textarea,select{font:inherit}button{cursor:pointer}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 8% 0%,rgba(82,128,184,.16),transparent 28%),radial-gradient(circle at 100% 18%,rgba(105,155,210,.12),transparent 24%)}
    .app{position:relative;display:grid;grid-template-columns:280px minmax(0,1fr);min-height:100vh}.side{padding:26px 20px;border-right:1px solid rgba(255,255,255,.65);background:rgba(247,249,252,.84);backdrop-filter:blur(18px)}
    .brand{display:flex;align-items:center;gap:12px;margin-bottom:28px}.mark{width:42px;height:42px;border-radius:13px;background:linear-gradient(145deg,#244d82,#6b9ed5);box-shadow:0 10px 22px rgba(42,88,145,.25);position:relative}.mark:after{content:"";position:absolute;left:10px;right:10px;top:20px;height:2px;background:#fff;box-shadow:0 -7px #fff,0 7px #fff;transform:skewX(-18deg)}
    .brand strong{font-size:18px}.brand small{display:block;color:var(--muted);margin-top:3px}.side h3{margin:24px 8px 10px;font-size:12px;letter-spacing:.12em;color:#8b97a8}.run-tools{display:grid;grid-template-columns:1fr auto;gap:6px;margin:0 2px 10px}.select-all-runs{display:flex;align-items:center;gap:6px;color:#66758a;font-size:11px}.run-tools button{border:1px solid var(--line);border-radius:8px;background:rgba(255,255,255,.7);padding:6px 8px;color:#647287;font-size:10px}.run-tools button.danger{grid-column:1/-1;color:#a64049}.run-tools button:hover:not(:disabled){background:#fff}.run-tools button.danger:hover:not(:disabled){background:#fff2f3;border-color:#e7bdc1}.run-tools button:disabled{opacity:.38;cursor:not-allowed}.run-list{display:flex;flex-direction:column;gap:7px}.run-row{display:grid;grid-template-columns:28px minmax(0,1fr) 32px;align-items:stretch;gap:3px;border-radius:12px}.run-row:hover,.run-row.active{background:#fff;box-shadow:0 8px 22px rgba(40,65,98,.08)}.run-select{display:grid;place-items:center}.run-select input{width:14px;height:14px}.run-item{border:0;text-align:left;padding:11px 6px 11px 2px;border-radius:0;background:transparent;color:var(--ink);cursor:pointer;width:100%;min-width:0}.run-item b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}.run-item span{display:flex;justify-content:space-between;margin-top:6px;color:var(--muted);font-size:11px}.run-delete{border:0;border-radius:0 12px 12px 0;background:transparent;color:#9ba6b4;cursor:pointer;font-size:16px}.run-delete:hover{color:var(--red);background:#fff2f3}.run-delete:disabled{cursor:not-allowed;opacity:.28;background:transparent;color:#9ba6b4}
    .status-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;background:#a2adbb}.status-dot.running,.status-dot.normalizing{background:var(--amber);box-shadow:0 0 0 4px rgba(178,122,40,.11)}.status-dot.awaiting-visual-approval{background:var(--blue);box-shadow:0 0 0 4px rgba(40,92,159,.11)}.status-dot.succeeded{background:var(--green)}.status-dot.failed{background:var(--red)}
    main{padding:28px 30px 60px;min-width:0}.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:22px}.topbar h1{font-size:28px;margin:0 0 6px;letter-spacing:-.04em}.topbar p{margin:0;color:var(--muted);font-size:14px}.env{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.chip{padding:7px 10px;border:1px solid var(--line);background:rgba(255,255,255,.72);border-radius:999px;color:#536174;font-size:12px}
    .new-run{display:grid;grid-template-columns:minmax(0,1fr) 280px auto;gap:14px;padding:18px;background:rgba(255,255,255,.82);border:1px solid rgba(255,255,255,.9);border-radius:18px;box-shadow:var(--shadow);margin-bottom:22px}.drop{position:relative;display:flex;align-items:center;gap:14px;min-height:76px;border:1.5px dashed #b6c6da;border-radius:14px;padding:14px 18px;background:#f8fafc;cursor:pointer}.drop.drag{border-color:var(--blue);background:#eff5fc}.drop input{position:absolute;inset:0;opacity:0;cursor:pointer}.drop-icon{width:42px;height:42px;border-radius:12px;background:#e3edf8;color:var(--blue);display:grid;place-items:center;font-size:22px}.drop b{font-size:14px}.drop span{display:block;color:var(--muted);font-size:12px;margin-top:5px}.checkpoint-option{display:flex;gap:10px;align-items:flex-start;padding:13px 14px;border:1px solid var(--line);border-radius:14px;background:#f8fafc}.checkpoint-option input{margin-top:3px}.checkpoint-option b{display:block;font-size:13px}.checkpoint-option span{display:block;color:var(--muted);font-size:11px;line-height:1.55;margin-top:4px}.run-button{border:0;border-radius:14px;padding:0 24px;background:linear-gradient(135deg,#244f87,#4d82bd);color:#fff;font-weight:700;box-shadow:0 12px 26px rgba(39,83,137,.22)}.run-button:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
    .empty{padding:70px 20px;text-align:center;color:var(--muted);background:rgba(255,255,255,.62);border:1px solid rgba(255,255,255,.9);border-radius:18px}.workspace{display:none}.workspace.visible{display:block}.summary{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:8px}.summary h2{margin:0;font-size:19px}.summary-meta,.debug-entry{color:var(--muted);font-size:12px}.debug-entry{margin-bottom:14px;font-family:Consolas,"Microsoft YaHei",monospace}.meter{height:5px;border-radius:99px;background:#dfe6ef;overflow:hidden;margin:9px 0 20px}.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#6d9bd2,#285c9f);transition:width .3s}
    .pipeline{display:grid;grid-template-columns:repeat(7,minmax(116px,1fr));gap:9px;margin-bottom:18px}.stage{position:relative;border:1px solid var(--line);border-radius:14px;padding:13px 12px;background:rgba(255,255,255,.76);min-height:106px}.stage:after{content:"";position:absolute;right:-10px;top:50%;width:10px;height:1px;background:#b7c3d2}.stage:last-child:after{display:none}.stage.active{border-color:#7ea5d1;box-shadow:0 0 0 2px rgba(78,128,184,.12);background:#fff}.stage .num{font:700 11px/1 "Segoe UI";color:#9ba6b4}.stage h4{font-size:13px;margin:10px 0 6px}.stage p{margin:0;color:var(--muted);font-size:11px;line-height:1.5}.stage.succeeded{border-top:3px solid var(--green)}.stage.running{border-top:3px solid var(--amber)}.stage.awaiting{border-top:3px solid var(--blue)}.stage.failed{border-top:3px solid var(--red)}
    .panel{background:rgba(255,255,255,.9);border:1px solid rgba(255,255,255,.95);border-radius:17px;box-shadow:0 12px 36px rgba(39,60,88,.07);overflow:hidden}.panel-head{display:flex;justify-content:space-between;align-items:center;padding:15px 17px;border-bottom:1px solid var(--line)}.panel-head h3{margin:0;font-size:14px}.panel-head span{font-size:11px;color:var(--muted)}
    .stage-reader{margin-bottom:16px}.stage-reader-body{padding:16px}.handoff{padding:11px 13px;border-left:3px solid var(--blue2);background:var(--blue-soft);color:#4e6178;font-size:12px;line-height:1.65;margin-bottom:14px}.reader-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.reader-card{border:1px solid var(--line);border-radius:13px;overflow:hidden;min-width:0}.reader-card h4{margin:0;padding:10px 12px;background:#f5f8fb;color:#53647a;font-size:12px}.reader-content{padding:12px;max-height:410px;overflow:auto}.reader-content pre{margin:0;white-space:pre-wrap;word-break:break-word;font:11px/1.55 Consolas,"Microsoft YaHei",monospace}.reader-content .plain{white-space:pre-wrap;word-break:break-word;font-size:12px;line-height:1.7}.reader-empty{padding:32px;text-align:center;color:var(--muted);font-size:12px}.subrecord{border-top:1px solid var(--line);margin-top:12px;padding-top:10px}.subrecord summary{font-size:11px;color:var(--blue);cursor:pointer}.subrecord pre{margin-top:9px;padding:10px;background:#111c2b;color:#dce7f5;border-radius:9px}
    .checkpoint{margin-top:14px;border:1px solid #a9c2df;border-radius:14px;background:#f4f8fd;overflow:hidden}.checkpoint-head{display:flex;justify-content:space-between;align-items:center;padding:13px 15px;border-bottom:1px solid #cbd9e8}.checkpoint-head h4{margin:0;font-size:13px}.checkpoint-head span{font-size:11px;color:var(--blue)}.checkpoint-note{padding:11px 15px;color:#52677f;font-size:12px;line-height:1.65}.page-form-list{display:grid;gap:10px;padding:0 15px 15px}.page-form{display:grid;grid-template-columns:minmax(220px,.8fr) minmax(300px,1.2fr) minmax(210px,.7fr);gap:10px;padding:12px;border:1px solid #d6e1ed;border-radius:12px;background:#fff}.page-form header b{display:block;font-size:12px}.page-form header small{display:block;color:var(--muted);font-size:11px;line-height:1.5;margin-top:4px}.field span{display:block;font-size:10px;color:#76869a;margin-bottom:5px}.field select,.field input,.advanced-json textarea{width:100%;border:1px solid #c9d5e3;border-radius:8px;background:#fff;padding:8px;color:var(--ink);font-size:11px}.field-output{padding:8px;border:1px solid #dbe4ee;border-radius:8px;background:#f6f8fb;color:#53647a;font-size:11px;line-height:1.45}.checkpoint-actions{display:flex;align-items:center;gap:10px;padding:13px 15px;border-top:1px solid #cbd9e8}.checkpoint-actions button{border:0;border-radius:9px;background:var(--blue);color:#fff;font-weight:700;padding:10px 15px}.checkpoint-actions span{color:var(--muted);font-size:11px}.advanced-json{margin:0 15px 15px}.advanced-json summary{font-size:11px;color:var(--blue)}.advanced-json textarea{min-height:260px;margin-top:9px;font-family:Consolas,monospace;line-height:1.5}.advanced-json button{margin-top:8px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 11px}
    .debug-panel{margin-top:16px}.debug-panel>summary{padding:14px 17px;cursor:pointer;font-size:13px;font-weight:700}.grid{display:grid;grid-template-columns:minmax(300px,.82fr) minmax(420px,1.18fr);gap:16px;padding:0 14px 14px}.events{max-height:520px;overflow:auto;padding:9px}.event{width:100%;border:0;background:transparent;text-align:left;padding:10px;border-radius:11px;display:grid;grid-template-columns:8px 1fr auto;gap:10px;align-items:start}.event:hover,.event.active{background:#edf3f9}.event i{width:8px;height:8px;border-radius:50%;margin-top:5px;background:#aab5c3}.event i.running,.event i.awaiting-user{background:var(--amber)}.event i.succeeded{background:var(--green)}.event i.failed,.event i.invalid-output{background:var(--red)}.event b{display:block;font-size:12px}.event small{display:block;color:var(--muted);margin-top:4px;line-height:1.45}.event time{font-size:10px;color:#9aa5b4;white-space:nowrap}.detail{min-height:380px;max-height:520px;overflow:auto;padding:16px}.detail-empty{display:grid;place-items:center;min-height:300px;color:var(--muted);font-size:13px}.detail-section{margin-bottom:16px}.detail-section h4{margin:0 0 8px;font-size:12px;color:#617086}.detail-section pre{margin:0;padding:13px;border-radius:11px;background:#101a29;color:#dce7f5;white-space:pre-wrap;word-break:break-word;font:11px/1.55 Consolas,"Microsoft YaHei",monospace;max-height:320px;overflow:auto}.detail-section .text{padding:12px;border:1px solid var(--line);border-radius:11px;background:#f8fafc;font-size:12px;line-height:1.65;white-space:pre-wrap;word-break:break-word}
    .artifacts{margin-top:16px}.artifact-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;padding:14px}.artifact{display:block;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#f8fafc;color:var(--ink);text-decoration:none}.artifact img{display:block;width:100%;aspect-ratio:16/9;object-fit:contain;background:#e9eef5}.artifact strong{display:block;padding:10px 12px;font-size:12px}.artifact.file{padding:16px}.artifact.file strong{padding:0}.error-box{padding:12px 14px;border-radius:11px;background:#fff0f1;color:#a2333d;font-size:12px;margin-bottom:15px}
    @media(max-width:1180px){.new-run{grid-template-columns:1fr auto}.checkpoint-option{grid-column:1}.pipeline{grid-template-columns:repeat(4,1fr)}.stage:after{display:none}.reader-grid,.grid{grid-template-columns:1fr}.page-form{grid-template-columns:1fr 1fr}.page-form header{grid-column:1/-1}}@media(max-width:760px){.app{display:block}.side{display:none}main{padding:18px}.new-run{grid-template-columns:1fr}.run-button{height:52px}.pipeline{grid-template-columns:repeat(2,1fr)}.page-form{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="app">
    <aside class="side"><div class="brand"><div class="mark"></div><div><strong>PPagenT</strong><small>正式生成工作台</small></div></div><h3>最近运行</h3><div class="run-tools"><label class="select-all-runs"><input id="select-all-runs" type="checkbox"><span>全选当前列表</span></label><button id="delete-selected-runs" type="button" disabled>删除所选</button><button id="delete-all-runs" class="danger" type="button" disabled>清空全部可删记录</button></div><div id="run-list" class="run-list"></div></aside>
    <main>
      <header class="topbar"><div><h1>稿件怎样变成 PPT</h1><p>沿正式生成线查看每一步的输入、提示词、导演输出和确定性程序。</p></div><div id="env" class="env"></div></header>
      <section class="new-run">
        <label id="drop" class="drop"><input id="file" type="file" accept=".docx,.md,.markdown,.txt"><div class="drop-icon">＋</div><div><b id="file-name">选择或拖入稿件</b><span>DOCX、Markdown 或 TXT</span></div></label>
        <label class="checkpoint-option"><input id="manual-checkpoint" type="checkbox"><span><b>调试时暂停表单</b><span>可选查看或修改文本模型填写的视觉方案；正式生成默认自动继续，不需要视觉模型。</span></span></label>
        <button id="run" class="run-button" disabled>开始生成</button>
      </section>
      <section id="empty" class="empty">选择稿件开始运行，或从左侧打开历史运行。</section>
      <section id="workspace" class="workspace">
        <div class="summary"><div><h2 id="run-title"></h2><div id="run-meta" class="summary-meta"></div></div><div id="run-state" class="chip"></div></div>
        <div id="debug-entry" class="debug-entry"></div><div class="meter"><i id="meter"></i></div><div id="pipeline" class="pipeline"></div>
        <section class="panel stage-reader"><div class="panel-head"><h3 id="reader-title">生成步骤</h3><span id="reader-status"></span></div><div id="reader" class="stage-reader-body"><div class="reader-empty">点击上方任一步骤查看</div></div></section>
        <details class="panel debug-panel"><summary>原始运行记录与调试细节（默认收起）</summary><div class="grid"><section class="panel"><div class="panel-head"><h3 id="events-title">真实流转记录</h3><span id="event-count"></span></div><div id="events" class="events"></div></section><section class="panel"><div class="panel-head"><h3>单条原始记录</h3><span id="detail-hint">点击左侧记录查看</span></div><div id="detail" class="detail"><div class="detail-empty">尚未选择记录</div></div></section></div></details>
        <section id="artifacts-panel" class="panel artifacts" hidden><div class="panel-head"><h3>生成结果</h3><span>同一条生成线的 Renderer 产物</span></div><div id="artifacts" class="artifact-grid"></div></section>
      </section>
    </main>
  </div>
  <script>
    const stages=[
      ["manuscript-normalization","稿件进入","原文件 → 规范化 Markdown"],
      ["content-director","内容导演","整套叙事、拆页与逐页内容稿"],
      ["shell-scaffold","页面壳","封面、目录、正文与尾页"],
      ["visual-candidates","资产候选","按 Logic 找合法核心资产"],
      ["visual-director","视觉导演","选资产、排版并填写程序表单"],
      ["visual-resolution","确定性解析","校验、State、绑定与载荷"],
      ["render","渲染交付","Native PPTX 与质量门禁"]
    ];
    const handoffs={
      "manuscript-normalization":"程序读取上传文件并统一转为 Markdown。这里不调用模型；输出全文会原样交给内容导演。",
      "content-director":"内容导演一次读取全文；每个 H1 就是一页，H2/H3 与列表形成页内内容。程序再编译 DeckPlan / PageContent。其输出不决定视觉资产，随后交给页面壳与视觉候选发现。",
      "shell-scaffold":"确定性程序补齐封面、目录、正文和尾页角色，不修改正文语义，随后为每个正文页准备视觉候选。",
      "visual-candidates":"程序依据内容导演识别的 Logic、容量和核心资产契约列出合法候选；这一步不调用模型，也不强行跨 Logic。",
      "visual-director":"视觉导演同时拿逐页内容稿与合法资产清单，填写结构、Composition、文字区域等正式表单。若本次开启人工检查，就在这里暂停修改同一份输出。",
      "visual-resolution":"程序验证视觉导演表单，确定 State、内容绑定与组件载荷。人工修改也走这一个解析器，不另建手动生成线。",
      "render":"Renderer 使用解析后的确定性数据生成 Native PPTX、页面预览与质量报告。"
    };
    const labels={"stage-call":"阶段调用","api-call":"模型 API","manual-checkpoint":"可选表单暂停","delivery":"交付"};
    let config=null,file=null,currentRun=null,events=[],selectedStage=null,pollTimer=null,readerToken=0,checkpointDraft=null,lastViewSignature=null,lastReaderSignature=null,activeRunId=null,runSummaries=[],deletableRunCount=0;
    const selectedRunIds=new Set();
    const traceCache=new Map();const $=id=>document.getElementById(id);const esc=value=>String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    const ms=value=>value==null?"—":value<1000?`${value} ms`:`${(value/1000).toFixed(1)} s`;
    async function json(url,options){const response=await fetch(url,options);const value=await response.json();if(!response.ok)throw new Error(value.error||`HTTP ${response.status}`);return value}
    function statusText(status){return ({normalizing:"稿件转换中",running:"生成中","awaiting-visual-approval":"等待检查视觉方案",succeeded:"已完成",failed:"失败"})[status]||status}
    async function boot(){config=await json("/api/workbench/config");$("env").innerHTML=`<span class="chip">主题 · ${esc(config.skin.name)}</span><span class="chip">${esc(config.provider.name)} · ${esc(config.provider.model)}</span><span class="chip">API ${config.provider.configured?"已配置":"未配置"}</span>`;await refreshRuns()}
    function syncRunSelectionControls(){const deletableVisible=runSummaries.filter(run=>run.runId!==activeRunId);const selectedVisible=deletableVisible.filter(run=>selectedRunIds.has(run.runId));const selectAll=$("select-all-runs");selectAll.disabled=!deletableVisible.length;selectAll.checked=Boolean(deletableVisible.length)&&selectedVisible.length===deletableVisible.length;selectAll.indeterminate=selectedVisible.length>0&&selectedVisible.length<deletableVisible.length;$("delete-selected-runs").disabled=!selectedRunIds.size;$("delete-selected-runs").textContent=selectedRunIds.size?`删除所选（${selectedRunIds.size}）`:"删除所选";$("delete-all-runs").disabled=!deletableRunCount;$("delete-all-runs").textContent=deletableRunCount?`清空全部可删记录（${deletableRunCount}）`:"清空全部可删记录"}
    async function refreshRuns(){const data=await json("/api/workbench/runs");activeRunId=data.activeRunId||null;runSummaries=data.runs||[];deletableRunCount=data.deletableRunCount||0;const visibleDeletable=new Set(runSummaries.filter(run=>run.runId!==activeRunId).map(run=>run.runId));for(const runId of selectedRunIds){if(!visibleDeletable.has(runId))selectedRunIds.delete(runId)}$("run-list").innerHTML=runSummaries.map(run=>`<div class="run-row ${currentRun?.runId===run.runId?"active":""}"><label class="run-select" title="选择这次运行"><input type="checkbox" data-select-run="${run.runId}" ${selectedRunIds.has(run.runId)?"checked":""} ${activeRunId===run.runId?"disabled":""}></label><button class="run-item" data-run="${run.runId}"><b>${esc(run.originalName)}</b><span><i><em class="status-dot ${run.status}"></em>${statusText(run.status)}</i><time>${new Date(run.createdAt).toLocaleString()}</time></span></button><button class="run-delete" data-delete-run="${run.runId}" data-delete-name="${esc(run.originalName)}" title="删除这次运行及全部后端记录" aria-label="删除 ${esc(run.originalName)}" ${activeRunId===run.runId?"disabled":""}>×</button></div>`).join("")||'<div style="padding:10px;color:#8a96a7;font-size:12px">还没有运行记录</div>';document.querySelectorAll("[data-run]").forEach(button=>button.onclick=()=>openRun(button.dataset.run));document.querySelectorAll("[data-delete-run]").forEach(button=>button.onclick=()=>deleteRunRecord(button.dataset.deleteRun,button.dataset.deleteName));document.querySelectorAll("[data-select-run]").forEach(input=>input.onchange=()=>{if(input.checked)selectedRunIds.add(input.dataset.selectRun);else selectedRunIds.delete(input.dataset.selectRun);syncRunSelectionControls()});syncRunSelectionControls()}
    async function applyDeletedRuns(result,message){const deleted=new Set(result.deletedRunIds||[]);for(const runId of deleted)selectedRunIds.delete(runId);if(currentRun&&deleted.has(currentRun.runId)){clearTimeout(pollTimer);currentRun=null;events=[];selectedStage=null;traceCache.clear();checkpointDraft=null;lastViewSignature=null;lastReaderSignature=null;$("workspace").classList.remove("visible");$("empty").style.display="block";$("empty").textContent=message;if(result.currentRunId)await openRun(result.currentRunId);else await refreshRuns()}else await refreshRuns()}
    async function deleteRunRecord(runId,name){if(activeRunId===runId)return;const confirmed=window.confirm(`确定删除“${name}”这次运行吗？\n\n输入稿件副本、API 事件、所有中间记录、预览和交付文件都会永久删除。`);if(!confirmed)return;try{const result=await json(`/api/workbench/runs/${runId}`,{method:"DELETE"});await applyDeletedRuns(result,"这次运行及其全部后端记录已经删除。") }catch(error){alert(error.message)}}
    async function deleteSelectedRuns(){const runIds=[...selectedRunIds];if(!runIds.length)return;const confirmed=window.confirm(`确定永久删除选中的 ${runIds.length} 次运行吗？\n\n这些运行的输入副本、API 事件、中间记录、预览和交付文件都会一起删除。`);if(!confirmed)return;try{const result=await json("/api/workbench/runs/batch-delete",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({runIds})});await applyDeletedRuns(result,`选中的 ${result.deletedRunIds.length} 次运行及其全部后端记录已经删除。`)}catch(error){alert(error.message)}}
    async function deleteAllRuns(){if(!deletableRunCount)return;const confirmed=window.confirm(`确定永久删除全部 ${deletableRunCount} 条可删运行吗？\n\n这会遍历完整后端记录目录，不只删除左侧当前显示的记录；正在运行或等待确认的任务会保留。`);if(!confirmed)return;try{const result=await json("/api/workbench/runs/batch-delete",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({mode:"all-deletable"})});await applyDeletedRuns(result,`全部 ${result.deletedRunIds.length} 条可删运行及其后端记录已经删除。`)}catch(error){alert(error.message)}}
    function isActive(){return currentRun&&["running","normalizing","awaiting-visual-approval"].includes(currentRun.status)}
    function chooseFile(next){file=next||null;$("file-name").textContent=file?file.name:"选择或拖入稿件";$("run").disabled=!file||isActive()}
    async function start(){if(!file)return;$("run").disabled=true;try{const mode=$("manual-checkpoint").checked?"manual":"auto";const response=await fetch(`/api/workbench/runs?filename=${encodeURIComponent(file.name)}&visualCheckpoint=${mode}`,{method:"POST",headers:{"content-type":"application/octet-stream"},body:file});const value=await response.json();if(!response.ok)throw new Error(value.error||"创建运行失败");await openRun(value.runId)}catch(error){alert(error.message);$("run").disabled=false}}
    async function openRun(runId){clearTimeout(pollTimer);currentRun=await json(`/api/workbench/runs/${runId}`);events=[];traceCache.clear();checkpointDraft=null;lastViewSignature=null;lastReaderSignature=null;await loadEvents();selectedStage=currentStage();$("empty").style.display="none";$("workspace").classList.add("visible");render();await refreshRuns();schedule()}
    async function loadEvents(){const after=events.at(-1)?.sequence||0;const data=await json(`/api/workbench/runs/${currentRun.runId}/events?after=${after}`);events.push(...data.events)}
    function viewSignature(){return JSON.stringify({runId:currentRun?.runId,status:currentRun?.status,finishedAt:currentRun?.finishedAt||null,visualCheckpoint:currentRun?.visualCheckpoint||null,artifacts:currentRun?.artifacts||[],selectedStage,events:events.map(event=>[event.sequence,event.stage,event.type,event.status,event.durationMs??null,event.error?.message||null])})}
    function readerSignature(){const stageEvents=events.filter(event=>event.stage===selectedStage);return JSON.stringify({runId:currentRun?.runId,status:currentRun?.status,selectedStage,events:stageEvents.map(event=>[event.sequence,event.type,event.status,event.durationMs??null,event.error?.message||null])})}
    function schedule(){clearTimeout(pollTimer);if(!isActive())return;pollTimer=setTimeout(async()=>{try{const previousStatus=currentRun.status;currentRun=await json(`/api/workbench/runs/${currentRun.runId}`);await loadEvents();if(currentRun.status==="awaiting-visual-approval"&&previousStatus!=="awaiting-visual-approval")selectedStage="visual-director";if(viewSignature()!==lastViewSignature)render();await refreshRuns()}catch{}schedule()},1000)}
    function stageInfo(stageId){const list=events.filter(event=>event.stage===stageId);const failed=list.some(event=>event.status==="failed");const awaiting=list.some(event=>event.type==="manual-checkpoint"&&event.status==="awaiting-user")&&!list.some(event=>event.type==="manual-checkpoint"&&event.status==="succeeded");const running=list.some(event=>event.status==="running")&&!list.some(event=>event.status==="succeeded");const succeeded=list.some(event=>event.status==="succeeded");return{list,status:failed?"failed":awaiting?"awaiting":running?"running":succeeded?"succeeded":"pending",calls:list.filter(event=>event.source==="model"&&event.type==="api-call"&&event.status==="running").length,duration:list.filter(event=>event.durationMs).reduce((sum,event)=>sum+event.durationMs,0)}}
    function currentStage(){if(currentRun?.status==="awaiting-visual-approval")return"visual-director";const active=stages.find(([id])=>["running","awaiting","failed"].includes(stageInfo(id).status));if(active)return active[0];const last=[...stages].reverse().find(([id])=>stageInfo(id).status==="succeeded");return last?.[0]||"manuscript-normalization"}
    function render(){
      const runMode=currentRun.visualCheckpointMode==="manual"?"表单调试暂停":currentRun.visualCheckpointMode==="auto"?"自动继续":"历史运行";$("run-title").textContent=currentRun.originalName;$("run-meta").textContent=`${new Date(currentRun.createdAt).toLocaleString()} · ${currentRun.skin?.name||"东北大学"} · ${currentRun.provider?.model||config.provider.model} · ${runMode} · ${currentRun.runId}`;$("debug-entry").textContent="调试入口 · .tmp/production-workbench/current-run.json";$("run-state").textContent=statusText(currentRun.status);
      const done=stages.filter(([id])=>stageInfo(id).status==="succeeded").length;$("meter").style.width=`${Math.round(done/stages.length*100)}%`;
      $("pipeline").innerHTML=stages.map(([id,name,desc],index)=>{const info=stageInfo(id);return`<button class="stage ${info.status} ${selectedStage===id?"active":""}" data-stage="${id}"><span class="num">0${index+1}</span><h4>${name}</h4><p>${desc}<br>${info.calls?`${info.calls} 次 API · `:""}${info.status==="awaiting"?"等待表单确认":info.duration?ms(info.duration):""}</p></button>`}).join("");document.querySelectorAll("[data-stage]").forEach(node=>node.onclick=()=>{selectedStage=node.dataset.stage;render()});
      const shown=selectedStage?events.filter(event=>event.stage===selectedStage):events;$("events-title").textContent=stages.find(item=>item[0]===selectedStage)?.[1]||"真实流转记录";$("event-count").textContent=`${shown.length} 条 · API 共 ${events.filter(e=>e.source==="model"&&e.type==="api-call"&&e.status==="running").length} 次`;$("events").innerHTML=shown.map(event=>`<button class="event" data-event="${event.sequence}"><i class="${event.status}"></i><span><b>${labels[event.type]||event.type} · ${esc(event.stage)}</b><small>${event.source==="model"?`${esc(event.provider)} ${esc(event.model)} · 第 ${event.attempt} 次尝试`:event.status}${event.error?.message?` · ${esc(event.error.message)}`:""}</small></span><time>${event.durationMs!=null?ms(event.durationMs):new Date(event.timestamp).toLocaleTimeString()}</time></button>`).join("")||'<div class="detail-empty">该阶段还没有记录</div>';document.querySelectorAll("[data-event]").forEach(node=>node.onclick=()=>showDetail(Number(node.dataset.event),node));renderArtifacts();$("run").disabled=!file||isActive();lastViewSignature=viewSignature();renderStageReader()
    }
    async function trace(event){if(!traceCache.has(event.sequence))traceCache.set(event.sequence,json(`/api/workbench/runs/${currentRun.runId}/trace/event-${String(event.sequence).padStart(4,"0")}`));return traceCache.get(event.sequence)}
    function valueMarkup(value,plain=false){if(value==null||value==="")return'<div class="reader-empty">本步骤尚未产生这部分记录</div>';const markdown=typeof value==="object"&&(value.contentMarkdown||value.contentDraftMarkdown);if(typeof markdown==="string"){const metadata=value.pageMetadata?{deckMetadata:value.deckMetadata,pageMetadata:value.pageMetadata}:value.contentMetadata;return`<div class="plain">${esc(markdown)}</div>${metadata?`<details class="subrecord"><summary>查看机器元数据</summary><pre>${esc(JSON.stringify(metadata,null,2))}</pre></details>`:""}`}return plain?`<div class="plain">${esc(value)}</div>`:`<pre>${esc(JSON.stringify(value,null,2))}</pre>`}
    function promptMarkup(detail){if(!detail)return'<div class="reader-empty">程序步骤，不调用模型</div>';return valueMarkup([detail.role&&`角色：${detail.role}`,detail.task].filter(Boolean).join("\n\n"),true)+(detail.request?`<details class="subrecord"><summary>查看实际 API 请求</summary>${valueMarkup(detail.request)}</details>`:"")+(detail.outputSchema?`<details class="subrecord"><summary>查看输出 Schema</summary>${valueMarkup(detail.outputSchema)}</details>`:"")}
    function readerElementKey(node,index){return node.id?`id:${node.id}`:node.dataset?.candidatePage?`candidate:${node.dataset.candidatePage}`:node.getAttribute("name")?`name:${node.getAttribute("name")}`:`${node.tagName.toLowerCase()}:${index}`}
    function captureReaderState(){const reader=$("reader");if(!reader)return null;const controls=[...reader.querySelectorAll("input,textarea,select")];const focusable=[...reader.querySelectorAll('input,textarea,select,button,summary,a[href],[tabindex]:not([tabindex="-1"])')];const active=document.activeElement;let selection=null;if(active&&reader.contains(active)&&typeof active.selectionStart==="number")selection={start:active.selectionStart,end:active.selectionEnd,direction:active.selectionDirection};return{scrolls:[...reader.querySelectorAll(".reader-content")].map(node=>({top:node.scrollTop,left:node.scrollLeft})),details:[...reader.querySelectorAll("details")].map(node=>node.open),controls:controls.map((node,index)=>({key:readerElementKey(node,index),value:node.value,checked:"checked" in node?node.checked:undefined})),focusKey:active&&reader.contains(active)?readerElementKey(active,focusable.indexOf(active)):null,selection}}
    function restoreReaderState(state){const reader=$("reader");if(!reader||!state)return;const controls=[...reader.querySelectorAll("input,textarea,select")];const controlState=new Map(state.controls.map(item=>[item.key,item]));controls.forEach((node,index)=>{const saved=controlState.get(readerElementKey(node,index));if(!saved)return;if(saved.checked!==undefined)node.checked=saved.checked;node.value=saved.value});[...reader.querySelectorAll("details")].forEach((node,index)=>{if(index<state.details.length)node.open=state.details[index]});const focusable=[...reader.querySelectorAll('input,textarea,select,button,summary,a[href],[tabindex]:not([tabindex="-1"])')];const focusTarget=focusable.find((node,index)=>readerElementKey(node,index)===state.focusKey);if(focusTarget){focusTarget.focus({preventScroll:true});if(state.selection&&typeof focusTarget.setSelectionRange==="function"){try{focusTarget.setSelectionRange(state.selection.start,state.selection.end,state.selection.direction||"none")}catch{}}}[...reader.querySelectorAll(".reader-content")].forEach((node,index)=>{const saved=state.scrolls[index];if(saved){node.scrollTop=saved.top;node.scrollLeft=saved.left}})}
    function isVisualCheckpointEditing(){return currentRun?.status==="awaiting-visual-approval"&&selectedStage==="visual-director"&&Boolean($("checkpoint-slot")?.querySelector(".checkpoint"))}
    async function renderStageReader(){if(isVisualCheckpointEditing())return;const signature=readerSignature();if(signature===lastReaderSignature)return;const token=++readerToken;const meta=stages.find(item=>item[0]===selectedStage)||stages[0];const readerState=captureReaderState();$("reader-title").textContent=`${meta[1]} · 输入 → 处理 → 输出`;$("reader-status").textContent=stageInfo(meta[0]).status;const stageEvents=events.filter(event=>event.stage===meta[0]);const details=await Promise.all(stageEvents.map(trace));if(token!==readerToken)return;const workflowInput=[...details].find(item=>item.source==="workflow"&&item.status==="running"&&item.input)?.input??details.find(item=>item.input)?.input;const modelCall=details.find(item=>item.source==="model"&&item.status==="running");const succeeded=[...details].reverse().find(item=>item.status==="succeeded"&&item.output);const failure=[...details].reverse().find(item=>item.status==="failed");$("reader").innerHTML=`<div class="handoff">${esc(handoffs[meta[0]])}</div><div class="reader-grid"><section class="reader-card"><h4>1 · 进入这一步的内容</h4><div class="reader-content">${valueMarkup(workflowInput)}</div></section><section class="reader-card"><h4>2 · 使用的提示词或程序规则</h4><div class="reader-content">${promptMarkup(modelCall)}</div></section><section class="reader-card"><h4>3 · 这一步实际输出</h4><div class="reader-content">${failure?`<div class="error-box">${esc(failure.error?.message||"执行失败")}</div>`:""}${valueMarkup(succeeded?.output)}</div></section></div>${meta[0]==="visual-director"&&currentRun.status==="awaiting-visual-approval"?'<div id="checkpoint-slot"><div class="reader-empty">读取可编辑视觉方案…</div></div>':""}`;if($("checkpoint-slot"))await renderCheckpoint();if(token!==readerToken)return;lastReaderSignature=signature;restoreReaderState(readerState)}
    function findCandidate(set,page){return(set?.candidates||[]).find(candidate=>candidate.familyId===page.familyId&&candidate.variantId===page.variantId)||(set?.candidates||[])[0]}
    function renderPageForms(state){const output=checkpointDraft;const pages=output.visualPlan.pages;const contents=new Map((state.input.pageContents||[]).map(page=>[page.pageId,page]));const sets=new Map((state.input.candidateSets||[]).map(set=>[set.pageId,set]));const compositions=new Map(output.compositionPlan.pages.map(page=>[page.pageId,page]));return pages.map(page=>{const content=contents.get(page.pageId)||{};const set=sets.get(page.pageId);const options=(set?.candidates||[]).map(item=>`<option value="${esc(item.familyId)}|${esc(item.variantId)}|${esc(item.silhouette)}" ${item.familyId===page.familyId&&item.variantId===page.variantId&&item.silhouette===page.silhouette?"selected":""}>${esc(item.structureGroupId)} · ${esc(item.variantId)} · ${esc(item.readiness||item.contentReadiness)}</option>`).join("");const composition=compositions.get(page.pageId);return`<section class="page-form"><header><b>${esc(page.pageId)} · ${esc(content.title||"未命名页面")}</b><small>${esc(content.logicIntent?.logicId||content.logicId||"Logic 见逐页稿")} · 候选只来自程序已确认的合法集合</small></header><label class="field"><span>Structure Group / Variant</span><select data-candidate-page="${esc(page.pageId)}">${options}</select></label><label class="field"><span>当前程序表单</span><div class="field-output">${esc(composition?.compositionId||"待求解")}<br>更换 Structure 后由程序重新填写完整 CompositionPlan</div></label></section>`}).join("")}
    async function renderCheckpoint(){const state=await json(`/api/workbench/runs/${currentRun.runId}/checkpoint/visual-director`);checkpointDraft=checkpointDraft||JSON.parse(JSON.stringify(state.originalOutput));const slot=$("checkpoint-slot");if(!slot)return;const readerState=captureReaderState();slot.innerHTML=`<section class="checkpoint"><div class="checkpoint-head"><h4>可选表单暂停 · 修改视觉导演的文本输出</h4><span>没有新增生成线、视觉模型或导演 API 调用</span></div><div class="checkpoint-note">下面每一项都是文本模型读取内容稿与资产清单后填写、即将交给确定性解析器的表单。可在该页合法候选内改 Structure Group；更换后，现有确定性路由器会重新填写配套 CompositionPlan，而不是沿用旧结构的残留字段。</div><div class="page-form-list">${renderPageForms(state)}</div><details class="advanced-json"><summary>高级：查看或编辑完整视觉导演 JSON</summary><textarea id="checkpoint-json">${esc(JSON.stringify(checkpointDraft,null,2))}</textarea><button id="apply-json" type="button">应用 JSON 到上方表单</button></details><div class="checkpoint-actions"><button id="continue-run" type="button">确认方案并继续确定性解析</button><span id="checkpoint-message">程序会继续校验页面数量、顺序、候选契约和容量。</span></div></section>`;document.querySelectorAll("[data-candidate-page]").forEach(select=>select.onchange=()=>changeCandidate(state,select.dataset.candidatePage,select.value));$("apply-json").onclick=()=>{try{checkpointDraft=JSON.parse($("checkpoint-json").value);renderCheckpoint()}catch(error){$("checkpoint-message").textContent=`JSON 无效：${error.message}`}};$("continue-run").onclick=submitCheckpoint;restoreReaderState(readerState)}
    function changeCandidate(state,pageId,value){const [familyId,variantId,silhouette]=value.split("|");const set=(state.input.candidateSets||[]).find(item=>item.pageId===pageId);const candidate=(set?.candidates||[]).find(item=>item.familyId===familyId&&item.variantId===variantId&&item.silhouette===silhouette);const visual=checkpointDraft.visualPlan.pages.find(item=>item.pageId===pageId);if(!candidate||!visual)return;visual.familyId=candidate.familyId;visual.variantId=candidate.variantId;visual.silhouette=candidate.silhouette;visual.adaptationStatus=candidate.adaptationStatus;renderCheckpoint()}
    function syncJson(){if($("checkpoint-json"))$("checkpoint-json").value=JSON.stringify(checkpointDraft,null,2)}
    async function submitCheckpoint(){const button=$("continue-run"),message=$("checkpoint-message");button.disabled=true;message.textContent="正在提交给同一条确定性生成线…";try{await json(`/api/workbench/runs/${currentRun.runId}/checkpoint/visual-director`,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({output:checkpointDraft})});currentRun=await json(`/api/workbench/runs/${currentRun.runId}`);await loadEvents();render();schedule()}catch(error){message.textContent=error.message;button.disabled=false}}
    function renderArtifacts(){const panel=$("artifacts-panel"),target=$("artifacts");if(!currentRun.artifacts?.length){panel.hidden=true;return}panel.hidden=false;target.innerHTML=currentRun.artifacts.map(item=>{const href=`/api/workbench/runs/${currentRun.runId}/artifact?path=${encodeURIComponent(item.path)}`;return item.kind==="image"?`<a class="artifact" href="${href}" target="_blank"><img src="${href}" alt="${esc(item.label)}"><strong>${esc(item.label)}</strong></a>`:`<a class="artifact file" href="${href}" target="_blank"><strong>${esc(item.label)} ↗</strong></a>`}).join("")}
    function section(title,value,plain=false){if(value==null||value==="")return"";const content=plain?`<div class="text">${esc(value)}</div>`:`<pre>${esc(JSON.stringify(value,null,2))}</pre>`;return`<section class="detail-section"><h4>${esc(title)}</h4>${content}</section>`}
    async function showDetail(sequence,node){document.querySelectorAll(".event.active").forEach(item=>item.classList.remove("active"));node.classList.add("active");$("detail").innerHTML='<div class="detail-empty">读取真实记录…</div>';const detail=await trace({sequence});$("detail-hint").textContent=`${detail.source} · ${detail.status}`;$("detail").innerHTML=(detail.error?`<div class="error-box">${esc(detail.error.message||detail.error)}</div>`:"")+section("角色",detail.role,true)+section("任务 / 系统要求",detail.task,true)+section("实际 API 请求",detail.request)+section("阶段输入",detail.input)+section("工作上下文",detail.context)+section("输出 Schema",detail.outputSchema)+section("阶段输出",detail.output)+section("API 原始响应",detail.response)+section("Token 使用",detail.usage)}
    $("file").onchange=event=>chooseFile(event.target.files[0]);$("run").onclick=start;$("select-all-runs").onchange=event=>{for(const run of runSummaries){if(run.runId===activeRunId)continue;if(event.target.checked)selectedRunIds.add(run.runId);else selectedRunIds.delete(run.runId)}document.querySelectorAll("[data-select-run]:not(:disabled)").forEach(input=>{input.checked=event.target.checked});syncRunSelectionControls()};$("delete-selected-runs").onclick=deleteSelectedRuns;$("delete-all-runs").onclick=deleteAllRuns;const drop=$("drop");["dragenter","dragover"].forEach(name=>drop.addEventListener(name,event=>{event.preventDefault();drop.classList.add("drag")}));["dragleave","drop"].forEach(name=>drop.addEventListener(name,event=>{event.preventDefault();drop.classList.remove("drag")}));drop.addEventListener("drop",event=>chooseFile(event.dataTransfer.files[0]));boot().catch(error=>{document.body.innerHTML=`<pre style="padding:30px">${esc(error.stack||error.message)}</pre>`})
